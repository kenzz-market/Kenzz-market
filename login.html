<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:#08080d;

font-family:Arial,sans-serif;

color:white;

}



.box{

width:350px;

background:#111119;

border:1px solid #333;

border-radius:20px;

padding:30px;

}



h2{

text-align:center;

}



input{

width:100%;

padding:13px;

margin-top:12px;

background:#08080d;

border:1px solid #333;

border-radius:12px;

color:white;

outline:none;

}



button{

width:100%;

margin-top:20px;

padding:14px;

border:0;

border-radius:12px;

background:linear-gradient(
135deg,
#ff316f,
#ff9d00
);

color:white;

font-weight:bold;

cursor:pointer;

}



#msg{

text-align:center;

margin-top:15px;

color:#aaa;

}



</style>

</head>



<body>


<div class="box">


<h2>
👑 Admin Kenzz
</h2>



<input

id="email"

type="email"

placeholder="Email">


<input

id="password"

type="password"

placeholder="Password">



<button onclick="login()">

Masuk

</button>



<div id="msg">

</div>



</div>





<!-- WAJIB URUTAN INI -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="settings.js"></script>

<script src="supabase.js"></script>



<script>


async function login(){


const email =

document
.getElementById("email")
.value;



const password =

document
.getElementById("password")
.value;



const msg =

document
.getElementById("msg");



try{


msg.innerHTML =
"Memeriksa akun...";



await loginUser(

email,

password

);



const role =

await checkRole();





if(
role === "owner"
||
role === "admin"
){



localStorage.setItem(

"kenzz_role",

role

);



msg.innerHTML =
"Login berhasil";



setTimeout(()=>{


location.href =
"admin.html";



},700);



}else{


msg.innerHTML =

"Akun tidak memiliki akses admin";


await logoutUser();


}



}


catch(error){



console.log(error);



msg.innerHTML =

error.message;



}



}



</script>



</body>

</html>
