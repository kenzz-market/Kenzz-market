<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin Kenzz Store</title>


<style>

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#08080d;
font-family:Arial,sans-serif;
color:white;

}



.box{

width:350px;
background:#111119;
padding:30px;
border-radius:20px;
border:1px solid #333;

}



h2{

text-align:center;

}



input{

width:100%;
padding:13px;
margin-top:12px;
background:#08080d;
border:1px solid #333;
border-radius:10px;
color:white;

}



button{

width:100%;
padding:13px;
margin-top:20px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#ff316f,#ff9d00);
color:white;
font-weight:bold;
cursor:pointer;

}



#msg{

text-align:center;
margin-top:15px;
font-size:14px;

}


</style>


</head>


<body>


<div class="box">


<h2>
👑 Kenzz Admin
</h2>


<input 
id="email"
type="email"
placeholder="Email">


<input 
id="password"
type="password"
placeholder="Password">


<button onclick="login()">

Masuk

</button>


<div id="msg"></div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


async function login(){


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;


const msg =
document.getElementById("msg");



try{


msg.innerHTML="Memeriksa akun...";



await loginUser(
email,
password
);



const role =
await checkRole();



if(
role === "owner" ||
role === "admin"
){


localStorage.setItem(
"kenzz_role",
role
);



msg.innerHTML=
"Login berhasil";


setTimeout(()=>{

location.href="admin.html";

},800);



}else{


msg.innerHTML=
"Akun tidak memiliki akses admin";


await logoutUser();


}



}catch(error){


msg.innerHTML=
"Email atau password salah";


console.log(error);


}



}



</script>


</body>

</html>
