<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keranjang Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

padding:20px;

background:#08080d;

color:white;

font-family:Arial,sans-serif;

}



.container{

max-width:800px;

margin:auto;

}



h1{

text-align:center;

}



.card{

display:flex;

gap:15px;

align-items:center;

background:#111119;

border:1px solid #333;

border-radius:18px;

padding:15px;

margin-top:15px;

}



.card img{

width:80px;

height:80px;

border-radius:12px;

object-fit:cover;

}



.info{

flex:1;

}



.price{

color:#00ffd5;

font-weight:bold;

}



.qty{

display:flex;

gap:8px;

align-items:center;

}



.qty button{

width:30px;

height:30px;

border:0;

border-radius:8px;

cursor:pointer;

}



.remove{

background:#ff316f;

color:white;

}



.checkout{

width:100%;

padding:15px;

margin-top:20px;

border:0;

border-radius:15px;

background:#25d366;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



.total{

margin-top:20px;

font-size:22px;

font-weight:bold;

text-align:right;

color:#00ffd5;

}



.empty{

text-align:center;

padding:50px;

color:#aaa;

}


</style>


</head>


<body>


<div class="container">


<h1>
🛒 Keranjang
</h1>



<div id="cart">

</div>



<div class="total">

Total:
Rp <span id="total">0</span>

</div>



<button class="checkout"
onclick="checkout()">

💬 Checkout WhatsApp

</button>



</div>





<script src="settings.js"></script>

<script src="supabase.js"></script>



<script>


let cart =
getCart();





function renderCart(){


const box =
document.getElementById("cart");


if(!cart.length){


box.innerHTML=

`

<div class="empty">

Keranjang masih kosong

</div>

`;



document
.getElementById("total")
.innerHTML="0";


return;


}





let total=0;




box.innerHTML =

cart.map((p,index)=>{


let price =
Number(p.price);


total +=
price * p.qty;



return `


<div class="card">


<img src="${p.image || 'https://via.placeholder.com/100'}">


<div class="info">


<h3>

${p.name}

</h3>


<div class="price">

Rp ${price.toLocaleString("id-ID")}

</div>



<div class="qty">


<button onclick="minus(${index})">

-

</button>



<b>

${p.qty}

</b>



<button onclick="plus(${index})">

+

</button>



<button class="remove"

onclick="removeItem(${index})">

Hapus

</button>


</div>


</div>


</div>


`;


}).join("");



document
.getElementById("total")
.innerHTML =

total.toLocaleString("id-ID");


}





function save(){

saveCart(cart);

renderCart();

}





function plus(i){

cart[i].qty++;

save();

}





function minus(i){


if(cart[i].qty>1){

cart[i].qty--;

}else{

cart.splice(i,1);

}


save();


}





function removeItem(i){

cart.splice(i,1);

save();

}





async function checkout(){
    if(!cart.length){
        alert("Keranjang kosong");
        return;
    }

    const ok = await requireMemberForPurchase({
        type: "cart",
        items: cart.map(p=>({
            id:p.id,
            name:p.name,
            price:Number(p.price || 0),
            qty:Number(p.qty || 1)
        }))
    });

    if(!ok) return;

    try{
        const updated = await decrementProductStocks(cart.map(p=>({id:p.id, qty:Number(p.qty || 1)})));
        if(!updated){
            alert('Salah satu produk sudah habis atau stoknya tidak mencukupi. Silakan cek kembali keranjang.');
            return;
        }
    }catch(e){
        console.error(e);
        alert('Stok belum dapat dikurangi. Silakan coba lagi.');
        return;
    }

    let text = `Halo ${STORE_SETTINGS.storeName},\n\nSaya ingin membeli:\n\n`;
    cart.forEach(p=>{
        text += `${p.name}\nJumlah: ${p.qty}\nHarga: Rp ${(Number(p.price)*p.qty).toLocaleString("id-ID")}\n\n`;
    });
    text += `Total: Rp ${document.getElementById("total").innerHTML}\n\nMohon bantu cek ketersediaan dan pilihkan produk yang tersedia.\n\nTerima kasih.`;

    window.location.href = "https://wa.me/"+STORE_SETTINGS.whatsappOwner+"?text="+encodeURIComponent(text);
}




renderCart();


</script>


</body>

</html>
