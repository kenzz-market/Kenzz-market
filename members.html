<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Daftar Member Kenzz Store</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#08080d;color:#fff;font-family:'Poppins',sans-serif;padding:20px}.container{max-width:950px;margin:auto}.card{background:#111119;border:1px solid #ffffff1f;border-radius:18px;padding:18px;margin-bottom:15px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{font-family:'Orbitron',sans-serif;font-size:22px;margin:0}.muted{color:#aaa;font-size:13px}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:15px}.search,.filter{padding:12px;border-radius:12px;border:1px solid #333;background:#08080d;color:#fff;font-family:inherit}.list{display:grid;gap:10px;margin-top:15px}.member{padding:15px;border-radius:14px;background:#181823;border:1px solid #ffffff12;display:grid;grid-template-columns:1fr auto;gap:12px}.name{font-weight:700}.meta{font-size:12px;color:#aaa;margin-top:4px;line-height:1.6}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;background:#ffffff10;color:#bbb;margin-right:5px}.email{color:#7dd3fc}.phone{color:#7dffbf}.google{color:#ffd36a}button{padding:11px 14px;border:0;border-radius:11px;background:#ff316f;color:#fff;font-weight:700;font-family:inherit;cursor:pointer}@media(max-width:650px){.tools{grid-template-columns:1fr}.member{grid-template-columns:1fr}.head button{width:100%}}</style></head><body><div class="container"><div class="card"><div class="head"><div><h1>👥 Daftar Member</h1><p id="status" class="muted">Memeriksa akses owner...</p></div><button onclick="location.href='admin.html'">← Admin</button></div><div class="tools"><input id="search" class="search" placeholder="Cari nama, email, atau nomor HP..."><select id="filter" class="filter"><option value="all">Semua</option><option value="email">Email</option><option value="phone">Phone</option><option value="google">Google</option></select></div></div><div id="list" class="list"><div class="card">Memuat...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
let members=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function providerClass(v){v=String(v||'').toLowerCase();return v.includes('google')?'google':v.includes('phone')?'phone':'email';}function render(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;const data=members.filter(m=>{const text=(m.name||'')+' '+(m.email||'')+' '+(m.phone||'');const hit=text.toLowerCase().includes(q);const type=providerClass(m.provider);return hit&&(f==='all'||type===f);});document.getElementById('status').textContent=members.length+' member terdaftar';document.getElementById('list').innerHTML=data.length?data.map((m,i)=>`<div class="member"><div><div class="name">${esc(m.name||'Tanpa nama')}</div><div class="meta"><span class="badge ${providerClass(m.provider)}">${esc(m.provider||'email')}</span>${esc(m.email||'-')}<br>📱 ${esc(m.phone||'-')}<br>📅 ${m.created_at?new Date(m.created_at).toLocaleString('id-ID'):'-'}</div></div><div class="muted">#${i+1}</div></div>`).join(''):'<div class="card muted">Member tidak ditemukan.</div>';}
async function start(){try{const role=await checkRole();if(role!=='owner'){document.getElementById('status').textContent='Akses hanya untuk owner.';document.getElementById('list').innerHTML='<div class="card">Akses ditolak.</div>';return;}members=await getMembers();render();}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('list').innerHTML='<div class="card">Gagal memuat daftar member.</div>';}}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);start();</script></body></html>
