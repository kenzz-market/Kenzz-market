<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Kenzz Store</title><style>body{margin:0;background:#08080d;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:20px;box-sizing:border-box}.box{max-width:520px;margin:40px auto;background:#111119;border:1px solid #333;border-radius:20px;padding:24px;box-sizing:border-box}h1{text-align:center;font-size:24px}p{color:#aaa}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#aaa;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;background:#08080d;border:1px solid #333;border-radius:11px;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:12px;margin-top:10px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#20202b}.msg{text-align:center;margin-top:14px;color:#aaa}.links{text-align:center;margin-top:18px}.links a{color:#00ffd5;text-decoration:none}.card{background:#171720;border:1px solid #2d2d38;border-radius:15px;padding:15px;margin-top:12px}.danger{background:#421824}.muted{color:#888;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}</style></head><body><main class="box"><h1>👥 Daftar Member</h1><div id="msg" class="msg">Memeriksa akses...</div><div id="list"></div><div class="links"><a href="admin.html">← Admin</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>(async()=>{const msg=document.getElementById('msg'),list=document.getElementById('list');try{const role=await checkRole();if(role!=='owner'){msg.textContent='Akses khusus owner.';return}const data=await getMembers();msg.textContent=data.length+' member';list.innerHTML=data.map(m=>`<div class="card"><div class="row"><b>${esc(m.name||'Member')}</b><span class="muted">${esc(m.provider||'email')}</span></div><p>${esc(m.email||'-')}</p><p>${esc(m.phone||'No. HP belum diisi')}</p><div class="muted">Daftar: ${new Date(m.created_at).toLocaleString('id-ID')}</div></div>`).join('')||'<div class="card">Belum ada member.</div>'}catch(e){msg.textContent=e.message}})();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
