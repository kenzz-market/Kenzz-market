<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member Kenzz Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#fff;font-family:Arial,sans-serif;padding:20px}.container{max-width:900px;margin:auto}.card{background:#111119;border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:15px}.member{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #333;padding:14px 0}.muted{color:#aaa;font-size:13px}button{padding:11px 15px;border:0;border-radius:11px;background:#ff316f;color:#fff;font-weight:bold}@media(max-width:600px){.member{grid-template-columns:1fr}}</style></head>
<body><div class="container"><div class="card"><h1>👥 Daftar Member</h1><p id="status" class="muted">Memeriksa akses owner...</p><button onclick="location.href='admin.html'">← Admin</button></div><div id="list" class="card">Memuat...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
async function start(){
 try{
  const role=await checkRole();
  if(role!=="owner"){document.getElementById("status").textContent="Akses hanya untuk owner.";document.getElementById("list").innerHTML="Akses ditolak.";return;}
  const data=await getMembers();
  document.getElementById("status").textContent=data.length+" member terdaftar";
  document.getElementById("list").innerHTML=data.length?data.map((m,i)=>`<div class="member"><div><b>${esc(m.name||"Tanpa nama")}</b><div class="muted">${esc(m.email||m.phone||"-")}</div><div class="muted">Provider: ${esc(m.provider||"-")} • ${new Date(m.created_at).toLocaleString("id-ID")}</div></div><div>#${i+1}</div></div>`).join(""):"Belum ada member.";
 }catch(e){document.getElementById("status").textContent=e.message;}
}
start();
</script></body></html>
