<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daftar Member Kenzz Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08080d;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:390px;background:#111119;border:1px solid #333;border-radius:22px;padding:25px}
h2{text-align:center;margin-top:0}input{width:100%;padding:13px;margin-top:10px;background:#08080d;border:1px solid #333;border-radius:12px;color:#fff}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold;cursor:pointer}
.secondary{background:#ffffff12;border:1px solid #ffffff20}.msg{text-align:center;color:#aaa;margin-top:14px;font-size:14px}.divider{text-align:center;color:#777;margin:15px 0}
.small{text-align:center;color:#aaa;font-size:13px}.back{display:block;text-align:center;margin-top:15px;color:#fff;text-decoration:none}
</style></head><body><div class="box">
<h2>👤 Daftar Member</h2>
<input id="name" placeholder="Nama lengkap">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password minimal 6 karakter">
<input id="phone" placeholder="Nomor HP (opsional)">
<button onclick="register()">Daftar dengan Email</button>
<div class="divider">atau</div>
<button class="secondary" onclick="google()">🔵 Daftar dengan Google</button>
<div class="divider">Login via Phone OTP</div>
<input id="phoneOtp" placeholder="+628xxxxxxxxxx">
<button class="secondary" onclick="sendOtp()">Kirim OTP</button>
<input id="otp" placeholder="Kode OTP">
<button class="secondary" onclick="verifyOtp()">Verifikasi OTP</button>
<div id="msg" class="msg"></div>
<p class="small">Data member otomatis tersimpan setelah akun dibuat.</p>
<a class="back" href="index.html">← Kembali ke toko</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
async function register(){
 const msg=document.getElementById("msg");
 try{
  msg.textContent="Mendaftarkan akun...";
  await signUpMember(
   document.getElementById("email").value.trim(),
   document.getElementById("password").value,
   document.getElementById("name").value.trim(),
   document.getElementById("phone").value.trim()
  );
  msg.textContent="Pendaftaran berhasil. Jika email confirmation aktif, cek email kamu.";
 }catch(e){msg.textContent=e.message;}
}
async function google(){
 try{await signInGoogle();}catch(e){document.getElementById("msg").textContent=e.message;}
}
async function sendOtp(){
 try{await sendPhoneOtp(document.getElementById("phoneOtp").value.trim());document.getElementById("msg").textContent="OTP dikirim.";}
 catch(e){document.getElementById("msg").textContent=e.message;}
}
async function verifyOtp(){
 try{await verifyPhoneOtp(document.getElementById("phoneOtp").value.trim(),document.getElementById("otp").value.trim());location.href="profile.html";}
 catch(e){document.getElementById("msg").textContent=e.message;}
}
</script></body></html>
