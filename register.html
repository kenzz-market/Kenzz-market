<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Member - Kenzz Store</title><style>body{margin:0;background:#08080d;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:20px;box-sizing:border-box}.box{max-width:520px;margin:40px auto;background:#111119;border:1px solid #333;border-radius:20px;padding:24px;box-sizing:border-box}h1{text-align:center;font-size:24px}p{color:#aaa}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#aaa;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;background:#08080d;border:1px solid #333;border-radius:11px;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:12px;margin-top:10px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#20202b}.msg{text-align:center;margin-top:14px;color:#aaa}.links{text-align:center;margin-top:18px}.links a{color:#00ffd5;text-decoration:none}.card{background:#171720;border:1px solid #2d2d38;border-radius:15px;padding:15px;margin-top:12px}.danger{background:#421824}.muted{color:#888;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}</style></head><body><main class="box"><h1>👤 Daftar Member</h1><p style="text-align:center">Buat akun untuk menjadi member Kenzz Store.</p><div class="field"><label>Nama</label><input id="name" placeholder="Nama lengkap"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="email@contoh.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Minimal 6 karakter"></div><div class="field"><label>No. WhatsApp (opsional)</label><input id="phone" type="tel" placeholder="08xxxxxxxxxx"></div><button class="btn" id="register">Daftar dengan Email</button><button class="btn secondary" id="google">🌐 Lanjut dengan Google</button><hr style="border-color:#333;margin:22px 0"><div class="field"><label>Login Phone OTP</label><input id="otpPhone" type="tel" placeholder="+628xxxxxxxxxx"></div><button class="btn secondary" id="sendOtp">Kirim Kode OTP</button><div class="field"><input id="otp" placeholder="Masukkan kode OTP"></div><button class="btn secondary" id="verifyOtp">Verifikasi OTP</button><div id="msg" class="msg"></div><div class="links"><a href="index.html">← Kembali ke Home</a> · <a href="profile.html">Profil</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>(async()=>{const $=id=>document.getElementById(id),msg=$('msg');$('register').onclick=async()=>{try{msg.textContent='Mendaftarkan akun...';const {data,error}=await supabaseClient.auth.signUp({email:$('email').value.trim(),password:$('password').value,name:$('name').value.trim(),options:{data:{name:$('name').value.trim(),phone:$('phone').value.trim()}}});if(error)throw error;msg.textContent=data.session?'Pendaftaran berhasil.':'Akun dibuat. Jika email confirmation aktif, cek email lalu login.';if(data.session)location.href='profile.html'}catch(e){msg.textContent=e.message}};$('google').onclick=async()=>{const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/profile.html'}});if(error)msg.textContent=error.message};$('sendOtp').onclick=async()=>{try{const phone=$('otpPhone').value.trim();if(!phone)throw new Error('Masukkan nomor dengan format internasional, misalnya +628...');const {error}=await supabaseClient.auth.signInWithOtp({phone});if(error)throw error;msg.textContent='OTP dikirim.'}catch(e){msg.textContent=e.message}};$('verifyOtp').onclick=async()=>{try{const phone=$('otpPhone').value.trim(),token=$('otp').value.trim();const {error}=await supabaseClient.auth.verifyOtp({phone,token,type:'sms'});if(error)throw error;location.href='profile.html'}catch(e){msg.textContent=e.message}}})();</script></body></html>
