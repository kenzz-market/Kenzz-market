<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anime Center • Kenzz Store</title>
<meta name="description" content="Jadwal anime berdasarkan musim, genre, dan tanggal rilis di Kenzz Store.">
<style>
:root{color-scheme:dark;--bg:#111217;--panel:#14151b;--line:#34353e;--muted:#9ba0af;--blue:#9bcaff;--accent:#8ebdff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f7;font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:1040px;margin:auto;padding:18px 16px 42px}.header{display:flex;align-items:center;gap:16px;min-height:74px}.hamb{font-size:25px;color:#bbb;border:0;background:none;padding:4px 8px}.season-title{font-size:24px;font-weight:500;line-height:1.25}.season-sub{color:#b2b4bf;font-size:14px}.tools{margin-left:auto;display:flex;gap:16px;color:#b9bbc5;font-size:22px}.tabs{display:flex;justify-content:space-around;gap:12px;margin:22px -16px 0;border-bottom:1px solid #34353d}.tab{padding:12px 8px 14px;min-width:65px;text-align:center;color:#b7b8c2;background:none;border:0;font:inherit;position:relative}.tab.active{color:#a9ceff}.tab.active:after{content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:4px;border-radius:4px 4px 0 0;background:#9cc8ff}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.modebar{display:flex;gap:8px;margin:14px 0 8px}.modebtn{border:1px solid #393d48;background:#1a1b23;color:#c8cbd5;padding:9px 13px;border-radius:10px;font:inherit}.modebtn.active{background:#25364d;border-color:#729dd4;color:#d8e9ff}.pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:18px 0}.pager button{border:1px solid #454957;background:#1b1d25;color:#eee;border-radius:9px;padding:8px 13px}.pager button:disabled{opacity:.35}.toolbar select,.toolbar input{background:#1b1c23;color:#e9eaf0;border:1px solid #3b3d47;border-radius:9px;padding:9px 11px;font:inherit}.toolbar input{flex:1;min-width:140px}.status{color:#a8abb8;font-size:13px;padding:18px 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.anime{height:176px;min-width:0;display:flex;cursor:pointer;transition:border-color .15s,transform .15s;overflow:hidden;border:1px solid #363740;border-radius:17px;background:#121319;position:relative}.poster{width:38%;max-width:150px;min-width:92px;object-fit:cover;background:#22232a}.details{padding:10px 10px 9px;min-width:0;flex:1;display:flex;flex-direction:column}.title{font-size:16px;line-height:1.42;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:23px}.meta{font-size:12px;color:#c2c5cf;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.countdown{font-size:12px;color:var(--blue);font-weight:650;margin-top:2px;white-space:nowrap}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;color:#d9d9e0;font-size:12px}.rating{position:absolute;bottom:6px;left:8px;padding:2px 5px;background:#101116d9;border-radius:6px;font-size:11px}.fav{position:absolute;right:7px;top:8px;border:0;background:#11121780;color:#d2d4de;font-size:23px;padding:0 2px;line-height:1.1;cursor:pointer}.fav.on{color:#a9ceff}.eps{white-space:nowrap;color:#d4d5dd}.empty{grid-column:1/-1;text-align:center;padding:42px 18px;color:#a9abb7;border:1px dashed #393b46;border-radius:14px}.footer{text-align:center;color:#747887;font-size:11px;margin-top:22px;line-height:1.6}.retry{border:1px solid #555b69;border-radius:9px;padding:8px 12px;background:#20212a;color:white;margin-top:12px}
@media(max-width:620px){.app{padding:12px 10px 30px}.season-title{font-size:22px}.grid{gap:10px}.anime{height:176px;border-radius:15px}.poster{width:39%;min-width:0}.details{padding:9px 7px}.title{font-size:14px;line-height:1.4}.meta,.countdown{font-size:11px}.bottom{font-size:11px}.tabs{margin-left:-10px;margin-right:-10px}.tab{min-width:55px;font-size:14px}.rating{left:5px;bottom:5px;font-size:10px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.anime{height:184px}.poster{width:36%;max-width:140px}.title{font-size:16px}.meta,.countdown{font-size:12px}}
</style></head>
<body><main class="app">
<header class="header"><button class="hamb" aria-label="Menu" onclick="location.href='index.html'">☰</button><div><div class="season-title" id="seasonTitle">Anime Center</div><div class="season-sub" id="seasonSub">Jadwal anime terbaru</div></div><div class="tools"><span title="Filter">☷</span><span title="Opsi">⋮</span></div></header>
<nav class="tabs" aria-label="Kategori"><button class="tab active" data-type="TV">TV</button><button class="tab" data-type="MOVIE">Movies</button><button class="tab" data-type="OVA">OVAs</button><button class="tab" data-type="ALL">All</button></nav>
<div class="toolbar"><select id="seasonFilter" aria-label="Musim dan tahun anime"></select><select id="genreFilter" aria-label="Genre anime"><option value="">Semua genre</option><option>Action</option><option>Adventure</option><option>Comedy</option><option>Drama</option><option>Fantasy</option><option>Horror</option><option>Mahou Shoujo</option><option>Mecha</option><option>Music</option><option>Mystery</option><option>Psychological</option><option>Romance</option><option>Sci-Fi</option><option>Slice of Life</option><option>Sports</option><option>Supernatural</option><option>Thriller</option></select><input id="search" placeholder="Cari judul anime…" aria-label="Cari judul anime"><select id="sort"><option value="time">Jadwal terdekat</option><option value="rating">Rating tertinggi</option><option value="title">Judul A–Z</option></select></div>
<div id="status" class="status">Mengambil jadwal anime terbaru…</div><section id="grid" class="grid" aria-live="polite"></section><div class="pager" id="pager" style="display:none"><button id="prevPage">‹ Sebelumnya</button><span id="pageLabel">Halaman 1</span><button id="nextPage">Berikutnya ›</button></div><div class="footer">Jadwal dan informasi anime dari AniList · Musim dimulai dari Winter 2027 · Countdown mengikuti waktu perangkat</div>
</main>
<script>
const API='https://graphql.anilist.co';let allAnime=[],activeType='TV',tickTimer=null;const $=id=>document.getElementById(id);const favKey='kenzz_anime_favorites_v1';let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem(favKey)||'[]'))}catch(e){}
function seasonLabel(s){return ({WINTER:'Winter',SPRING:'Spring',SUMMER:'Summer',FALL:'Fall'})[s]||s}
function initSeasons(){let sel=$('seasonFilter');for(let yr=2027;yr<=2035;yr++){for(let sn of ['WINTER','SPRING','SUMMER','FALL']){let o=document.createElement('option');o.value=sn+'-'+yr;o.textContent=seasonLabel(sn)+' '+yr;if(yr===2027&&sn==='WINTER')o.selected=true;sel.appendChild(o)}}}
function queryForSeason(value,genre){let [season,year]=value.split('-');let genreArg=genre?',genre_in:'+JSON.stringify([genre]):'';return `query { Page(page:1,perPage:50) { pageInfo { total hasNextPage } media(season:${season},seasonYear:${year},type:ANIME${genreArg},sort:POPULARITY_DESC) { id title { romaji english native } coverImage { large extraLarge } episodes averageScore format season seasonYear genres nextAiringEpisode { airingAt episode } status startDate { year month day } relations { edges { relationType node { id title { romaji english } format status season seasonYear startDate { year month day } } } } } } }`}
function queryUpcoming(){let now=Math.floor(Date.now()/1000);return `query { Page(page:1,perPage:50) { airingSchedules(airingAt_greater:${now-3600},airingAt_lesser:${now+14*86400},sort:TIME) { airingAt episode media { id title { romaji english native } coverImage { large extraLarge } episodes averageScore format season seasonYear genres nextAiringEpisode { airingAt episode } status startDate { year month day } } } } }`}
async function gql(query){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query})});if(!r.ok)throw new Error('API returned '+r.status);let j=await r.json();if(j.errors)throw new Error(j.errors[0]?.message||'Gagal mengambil data');return j.data}
async function load(){ $('status').textContent='Mengambil jadwal anime…';$('grid').innerHTML='';try{let seasonVal=$('seasonFilter').value,genre=$('genreFilter').value;let seasonData=await gql(queryForSeason(seasonVal,genre));let items=seasonData.Page.media||[];let now=Math.floor(Date.now()/1000);let soon=items.filter(a=>a.nextAiringEpisode&&a.nextAiringEpisode.airingAt>=now-3600).map(a=>({...a,airingAt:a.nextAiringEpisode.airingAt,airingEpisode:a.nextAiringEpisode.episode}));if(!genre&&soon.length<8){let upcoming=await gql(queryUpcoming());for(let x of upcoming.Page.airingSchedules||[]){let a=x.media;if(!a)continue;let existing=soon.find(y=>y.id===a.id);if(existing){if(x.airingAt<existing.airingAt){existing.airingAt=x.airingAt;existing.airingEpisode=x.episode}}else if((a.season+'-'+a.seasonYear)===seasonVal)soon.push({...a,airingAt:x.airingAt,airingEpisode:x.episode})}}
allAnime=soon.length?soon:items.map(a=>({...a,airingAt:a.nextAiringEpisode?.airingAt||null,airingEpisode:a.nextAiringEpisode?.episode||null}));$('seasonTitle').textContent='Anime Center';$('seasonSub').textContent=seasonVal.split('-')[0].replace(/^./,c=>c.toUpperCase())+' '+seasonVal.split('-')[1]+' · '+(genre||'Semua genre');$('status').textContent=`${allAnime.length} judul ditemukan · data diurutkan berdasarkan popularitas/jadwal`;render()}catch(err){$('status').innerHTML='Jadwal belum bisa dimuat. Periksa koneksi internet lalu coba lagi.<br><button class="retry" onclick="load()">Coba lagi</button>';console.error(err)}}
function displayTitle(a){return a.title?.english||a.title?.romaji||a.title?.native||'Judul tidak tersedia'}function formatLeft(ts){if(!ts)return 'Jadwal belum tersedia';let sec=ts-Math.floor(Date.now()/1000);if(sec<=0)return 'Sedang tayang / baru dirilis';let d=Math.floor(sec/86400);sec%=86400;let h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60);let s=sec%60;return `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`}
function typeOf(a){if(a.format==='MOVIE')return 'MOVIE';if(['OVA','ONA','SPECIAL','MUSIC'].includes(a.format))return 'OVA';return 'TV'}
function relationLabel(a){let rel=a.relations?.edges||[];let sequel=rel.find(e=>e.relationType==='SEQUEL'&&e.node?.type!=='MANGA');let prequel=rel.find(e=>e.relationType==='PREQUEL'&&e.node?.type!=='MANGA');if(sequel)return 'Sekuel: '+(sequel.node.title.english||sequel.node.title.romaji);if(prequel)return 'Lanjutan dari: '+(prequel.node.title.english||prequel.node.title.romaji);return ''}
function render(){let term=$('search').value.trim().toLowerCase(),sort=$('sort').value;let data=allAnime.filter(a=>activeType==='ALL'||typeOf(a)===activeType).filter(a=>displayTitle(a).toLowerCase().includes(term)||(a.title?.romaji||'').toLowerCase().includes(term));if(sort==='rating')data.sort((a,b)=>(b.averageScore||0)-(a.averageScore||0));else if(sort==='title')data.sort((a,b)=>displayTitle(a).localeCompare(displayTitle(b)));else data.sort((a,b)=>(a.airingAt||9999999999)-(b.airingAt||9999999999));$('grid').innerHTML='';if(!data.length){$('grid').innerHTML='<div class="empty">Tidak ada anime yang cocok. Coba musim atau genre lain.</div>';return}for(let a of data){let card=document.createElement('article');card.className='anime';card.tabIndex=0;card.setAttribute('role','link');card.setAttribute('aria-label','Lihat detail '+displayTitle(a));card.onclick=(ev)=>{if(ev.target.closest('.fav'))return;location.href='anime-detail.html?id='+encodeURIComponent(a.id)};card.onkeydown=(ev)=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target===card){ev.preventDefault();location.href='anime-detail.html?id='+encodeURIComponent(a.id)}};let img=document.createElement('img');img.className='poster';img.loading='lazy';img.alt='Poster '+displayTitle(a);img.src=a.coverImage?.extraLarge||a.coverImage?.large||'';img.onerror=()=>{img.style.background='#242631';img.removeAttribute('src')};let details=document.createElement('div');details.className='details';let title=document.createElement('div');title.className='title';title.textContent=displayTitle(a);title.title=displayTitle(a);let meta=document.createElement('div');meta.className='meta';meta.textContent=(a.airingEpisode?'EP'+a.airingEpisode+' · ':'')+(a.format||'TV')+' · '+(a.status==='RELEASING'?'Streaming':a.status==='NOT_YET_RELEASED'?'Akan rilis':a.status==='FINISHED'?'Selesai':'JP');let countdown=document.createElement('div');countdown.className='countdown';countdown.dataset.time=a.airingAt||'';countdown.textContent=formatLeft(a.airingAt);let bottom=document.createElement('div');bottom.className='bottom';let eps=document.createElement('span');eps.className='eps';eps.textContent='◉ 0/'+(a.episodes||'—');let rating=document.createElement('span');rating.className='rating';rating.textContent='★ '+(a.averageScore?(a.averageScore/10).toFixed(2):'—');let fav=document.createElement('button');fav.className='fav'+(favorites.has(a.id)?' on':'');fav.title='Favorit';fav.setAttribute('aria-label','Simpan favorit');fav.textContent=favorites.has(a.id)?'▣':'♧';fav.onclick=()=>{if(favorites.has(a.id))favorites.delete(a.id);else favorites.add(a.id);try{localStorage.setItem(favKey,JSON.stringify([...favorites]))}catch(e){}fav.classList.toggle('on',favorites.has(a.id));fav.textContent=favorites.has(a.id)?'▣':'♧'};bottom.append(eps);details.append(title,meta,countdown,bottom);card.append(img,details,rating,fav);$('grid').append(card)}}
initSeasons();$('seasonFilter').addEventListener('change',load);$('genreFilter').addEventListener('change',load);let searchDebounce;$('search').addEventListener('input',()=>{clearTimeout(searchDebounce);searchDebounce=setTimeout(render,200)});$('sort').addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeType=b.dataset.type;render()}));load();tickTimer=setInterval(()=>document.querySelectorAll('.countdown[data-time]').forEach(el=>{let v=Number(el.dataset.time);el.textContent=formatLeft(v||null)}),1000);
</script></body></html>
