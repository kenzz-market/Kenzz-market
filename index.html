<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenzz Store</title>
<style>
body{margin:0;background:#050509;color:#fff;font-family:Arial}
.container{max-width:600px;margin:auto;padding:20px 15px 100px}
.card,.hero{margin-top:15px;padding:22px;border-radius:22px;background:#111b;border:1px solid #ffffff30}
.hero{text-align:center;background:linear-gradient(#0008,#0008),url('https://c.termai.cc/i128/WY2mWaT.jpg');background-size:cover}
.button{display:inline-block;padding:12px 18px;background:#ff316f;color:#fff;border-radius:12px;text-decoration:none;margin:5px}
.item{display:block;padding:15px;background:#ffffff15;border-radius:15px;margin:10px 0;color:#fff;text-decoration:none}
.social a{padding:12px;background:#ffffff20;border-radius:50%;color:white;text-decoration:none}
.wa{position:fixed;right:20px;bottom:80px;background:#25d366;padding:15px;border-radius:50%;color:#fff;text-decoration:none}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:15px;background:#111d;display:flex;justify-content:space-around}
.bottom a{color:white}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<h1>KENZZ STORE</h1>
<p>DIGITAL PREMIUM MARKET</p>
<a class="button" href="products.html">🛒 List Produk</a>
</div>

<div class="card">
<h2>✅ Verified Official</h2>
<p>🟢 Online Trusted Store</p>
</div>

<div class="card">
<a class="item" href="products.html">🛒 Store Online</a>
<a class="item" href="tools.html">⚒️ Tools Premium</a>
<a class="item" href="announcement.html">🔔 Update</a>
<a class="item" href="support.html">🎧 Support</a>
</div>

<div class="card">
<h2>🌐 Community</h2>
<div class="social">
<a id="ig">📷</a>
<a id="tt">🎵</a>
<a id="yt">▶️</a>
<a id="tg">✈️</a>
</div>
<br>
<a class="button" id="channel">📢 Saluran WhatsApp</a>
<a class="button" id="group">👥 Grup WhatsApp</a>
</div>
</div>

<a id="wa" class="wa">💬</a>

<nav class="bottom">
<a href="index.html">🏠</a>
<a href="announcement.html">🔔</a>
<a href="cart.html">🛒</a>
<a href="login.html">👑</a>
</nav>

<script src="settings.js"></script>
<script>
if(window.STORE_SETTINGS){
wa.href="https://wa.me/"+STORE_SETTINGS.whatsappOwner;
ig.href=STORE_SETTINGS.socialMedia.instagram;
tt.href=STORE_SETTINGS.socialMedia.tiktok;
yt.href=STORE_SETTINGS.socialMedia.youtube;
tg.href=STORE_SETTINGS.socialMedia.telegram;
channel.href=STORE_SETTINGS.whatsappChannel;
group.href=STORE_SETTINGS.whatsappGroup;
}
</script>
</body>
</html>
