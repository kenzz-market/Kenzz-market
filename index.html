<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenzz Store</title>
<style>
:root{--bg:#050509;--panel:#111119;--text:#fff;--line:rgba(255,255,255,.12)}
.light{--bg:#f5f5f5;--panel:#fff;--text:#111;--line:rgba(0,0,0,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
.container{max-width:760px;margin:auto;padding-bottom:90px}
.top{padding:15px;background:var(--panel);position:sticky;top:0}
.nav{display:flex;align-items:center}
.logo{font-size:24px;font-weight:bold;margin-right:auto}
.icon{padding:10px;border-radius:50%}
.hero,.card,.feature{margin:15px;padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.hero{min-height:280px;background:linear-gradient(#0008,#0008),url('https://c.termai.cc/i148/N28g6Y6.jpg');background-size:cover}
.btn{display:inline-block;padding:12px 18px;background:#ff316f;color:white;border-radius:12px;text-decoration:none}
.feature{text-decoration:none;color:inherit;display:flex;gap:15px}
.socials{display:flex;gap:10px}
.socials a{padding:12px;border-radius:50%;background:var(--panel)}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:15px;display:flex;justify-content:space-around;background:var(--panel)}
.whatsapp{position:fixed;right:20px;bottom:80px;background:#25d366;color:white;padding:15px;border-radius:50%;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="top"><div class="nav"><div class="logo">Kenzz Store</div><button class="icon" onclick="changeTheme()">🌙</button></div></div>

<section class="hero">
<h1>Kenzz Store</h1>
<p>Official Digital Store</p>
<a class="btn" href="products.html">Store Online</a>
</section>

<div class="card">✅ Verified Official<br><small>Toko resmi Kenzz Store</small></div>

<a class="feature" href="products.html">🛒 Store Online</a>
<a class="feature" href="tools.html">⚒️ Tools Premium</a>
<a class="feature" href="announcement.html">🔔 Update Terbaru</a>
<a class="feature" href="support.html">🎧 Support</a>

<div class="card">
<h2>📚 Katalog</h2>
<a class="btn" href="products.html">Buka Katalog</a>
</div>

<div class="card">
<h2>Social Media</h2>
<div class="socials">
<a id="tiktok">🎵</a>
<a id="instagram">📷</a>
<a id="youtube">▶️</a>
<a id="telegram">✈️</a>
</div>
</div>
</div>

<a id="wa" class="whatsapp">💬</a>

<nav class="bottom">
<a href="index.html">⌂</a>
<a href="announcement.html">🔔</a>
<a href="cart.html">🛒</a>
<a href="login.html">👑</a>
</nav>

<script src="settings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
function changeTheme(){
document.body.classList.toggle('light');
localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');
}
if(localStorage.getItem('theme')==='light'){document.body.classList.add('light')}
if(window.STORE_SETTINGS){
wa.href='https://wa.me/'+STORE_SETTINGS.whatsappOwner;
tiktok.href=STORE_SETTINGS.socialMedia.tiktok;
instagram.href=STORE_SETTINGS.socialMedia.instagram;
youtube.href=STORE_SETTINGS.socialMedia.youtube;
telegram.href=STORE_SETTINGS.socialMedia.telegram;
}
</script>
</body>
</html>
