<script src="supabase.js"></script>

<script>
async function load(){
    let data = await getProducts();

    const box = document.getElementById("products");

    if(!data || data.length === 0){
        box.innerHTML = "<p>Belum ada produk</p>";
        return;
    }

    box.innerHTML = data.map(p => `
        <div>
            <h3>${p.name}</h3>
            <p>Rp ${p.price}</p>
            <p>Stok: ${p.stock}</p>
        </div>
    `).join("");
}

load();
</script>
