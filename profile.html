<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil Member Kenzz Store</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08080d;color:#fff;font-family:Arial,sans-serif;padding:20px}.box{max-width:600px;margin:auto;background:#111119;border:1px solid #333;border-radius:22px;padding:25px}input{width:100%;padding:13px;margin:10px 0;background:#08080d;border:1px solid #333;border-radius:12px;color:#fff}button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold}.info{color:#aaa}.msg{text-align:center;color:#aaa;margin-top:12px}a{color:#fff;text-decoration:none}</style></head>
<body><div class="box"><h1>🙍 Profil Member</h1><p id="account" class="info">Memuat...</p><input id="name" placeholder="Nama"><input id="phone" placeholder="Nomor HP"><button onclick="save()">Simpan Perubahan</button><button onclick="logoutMember()">Keluar</button><p id="msg" class="msg"></p><p><a href="index.html">← Kembali ke toko</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
let userId="";
async function start(){
 const user=await getCurrentUser();
 if(!user){location.href="register.html";return;}
 userId=user.id;
 const p=await getMemberProfile();
 document.getElementById("account").textContent=user.email||user.phone||"Akun member";
 if(p){document.getElementById("name").value=p.name||"";document.getElementById("phone").value=p.phone||"";}
}
async function save(){
 try{await updateMember(userId,{name:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim()});document.getElementById("msg").textContent="Profil berhasil disimpan.";}
 catch(e){document.getElementById("msg").textContent=e.message;}
}
start();
</script></body></html>
