<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil Member • Kenzz Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}:root{--pink:#ff316f;--cyan:#00ffd5;--green:#25d366;--bg:#070812;--panel:rgba(18,20,34,.82);--line:rgba(255,255,255,.1);--muted:#a8adbf}body{margin:0;min-height:100vh;padding:14px;color:#fff;font-family:Poppins,sans-serif;background:radial-gradient(circle at 10% 0%,rgba(255,49,111,.18),transparent 30%),radial-gradient(circle at 90% 10%,rgba(0,255,213,.10),transparent 25%),linear-gradient(145deg,#070812,#0d1020);}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:10px 13px;border-radius:12px}.brand{font-family:Orbitron;font-weight:900;letter-spacing:2px}.brand span{color:var(--pink)}.hero{padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,49,111,.16),rgba(0,255,213,.06));box-shadow:0 20px 55px rgba(0,0,0,.25)}.avatar{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#7c5cff);font-size:28px;margin-bottom:12px}.hero h1{margin:0;font-size:24px}.hero p{margin:6px 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:18px}.card h2{margin:0 0 12px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:rgba(255,255,255,.045);text-align:center}.stat b{display:block;font-size:21px;color:var(--cyan)}.stat span{font-size:10px;color:var(--muted)}input{width:100%;padding:12px;margin-top:9px;border-radius:12px;background:#090a12;border:1px solid #333746;color:#fff;font-family:inherit}button{border:0;border-radius:12px;padding:12px;width:100%;margin-top:10px;color:#fff;font-weight:800;font-family:inherit;cursor:pointer}.save{background:linear-gradient(135deg,var(--pink),#ff6b9a)}.logout{background:rgba(255,49,111,.12);border:1px solid rgba(255,49,111,.3);color:#ff7ea2}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tabs button{margin:0;background:rgba(255,255,255,.05);border:1px solid var(--line)}.tabs button.active{background:linear-gradient(135deg,var(--pink),#ff5c8c)}.fav,.history{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);border-radius:14px;margin-top:8px}.fav img{width:52px;height:52px;border-radius:12px;object-fit:cover}.fav .info,.history .info{flex:1;min-width:0}.info b{display:block}.muted{color:var(--muted);font-size:11px}.empty{text-align:center;padding:22px;color:#8f94a5}.msg{color:#9ea3b4;font-size:12px;text-align:center;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:20px}}
</style></head>
<body><div class="wrap">
<div class="top"><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Toko</a><div class="brand">KENZZ <span>STORE</span></div></div>
<section class="hero"><div class="avatar"><i class="fa-solid fa-user"></i></div><h1 id="welcome">Profil Member</h1><p id="account">Memuat akun...</p></section>
<div class="grid">
<section class="card"><h2><i class="fa-solid fa-user-gear"></i> Data Akun</h2><input id="name" placeholder="Nama"><input id="phone" placeholder="Nomor HP"><button class="save" onclick="save()">Simpan Perubahan</button><button class="logout" onclick="logoutMember()">Keluar</button><p id="msg" class="msg"></p></section>
<section class="card"><h2><i class="fa-solid fa-chart-simple"></i> Aktivitas Belanja</h2><div class="stats"><div class="stat"><b id="purchaseCount">0</b><span>Pembelian</span></div><div class="stat"><b id="favoriteCount">0</b><span>Favorit</span></div><div class="stat"><b id="itemCount">0</b><span>Item</span></div></div></section>
</div>
<section class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0;font-size:16px">🔔 Status & Notifikasi</h2><button style="width:auto;margin:0;padding:8px 10px;background:#ffffff08;border:1px solid #ffffff12" onclick="loadNotes()">Refresh</button></div><div id="memberNotes" class="empty" style="padding:14px">Memuat notifikasi...</div></section><section class="card" style="margin-top:14px"><div class="tabs"><button id="favTab" class="active" onclick="showTab('favorites')">❤️ Favorit</button><button id="historyTab" onclick="showTab('history')">🧾 Riwayat Pembelian</button></div><div id="favoritesPanel"></div><div id="historyPanel" style="display:none"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
let favs=[],history=[],notes=[];
async function start(){const user=await getCurrentUser();if(!user){location.href='register.html';return;}const p=await getMemberProfile();document.getElementById('account').textContent=user.email||user.phone||'Akun member';document.getElementById('welcome').textContent='Halo, '+(p?.name||'Member')+' 👋';document.getElementById('name').value=p?.name||'';document.getElementById('phone').value=p?.phone||'';await refreshActivity();await loadNotes();}
async function refreshActivity(){try{[favs,history]=await Promise.all([getFavorites(),getPurchaseHistory()]);document.getElementById('favoriteCount').textContent=favs.length;document.getElementById('purchaseCount').textContent=history.length;document.getElementById('itemCount').textContent=history.reduce((n,h)=>n+(h.items||[]).reduce((x,i)=>x+Number(i.qty||1),0),0);renderFavs();renderHistory();}catch(e){document.getElementById('favoritesPanel').innerHTML='<div class="empty">Aktivitas belum tersedia.</div>';}}
function renderFavs(){const box=document.getElementById('favoritesPanel');box.innerHTML=favs.length?favs.map(f=>`<div class="fav"><img src="${f.product_image||'https://via.placeholder.com/100'}"><div class="info"><b>${f.product_name||'Produk'}</b><span class="muted">Rp ${Number(f.product_price||0).toLocaleString('id-ID')}</span></div></div>`).join(''):'<div class="empty">Belum ada produk favorit. Tekan ❤️ pada katalog untuk menyimpannya.</div>';}
function renderHistory(){const box=document.getElementById('historyPanel');box.innerHTML=history.length?history.map(h=>`<div class="history"><div class="info"><b>${(h.items||[]).map(i=>`${i.name} ×${i.qty}`).join(', ')}</b><span class="muted">${new Date(h.created_at).toLocaleString('id-ID')} · <strong>${h.status||'Menunggu konfirmasi'}</strong></span></div><strong>Rp ${Number(h.total||0).toLocaleString('id-ID')}</strong></div>`).join(''):'<div class="empty">Belum ada riwayat pembelian.</div>';}
async function loadNotes(){try{notes=await getMemberNotifications();const box=document.getElementById('memberNotes');box.innerHTML=notes.length?notes.slice(0,8).map(n=>`<div class="history"><div class="info"><b>${n.title||'Notifikasi'}</b><span class="muted">${n.message||''}<br>${new Date(n.created_at).toLocaleString('id-ID')}</span></div></div>`).join(''):'<div class="empty">Belum ada notifikasi.</div>';await markMemberNotificationsRead();}catch(e){document.getElementById('memberNotes').textContent='Notifikasi belum tersedia.';}}
function showTab(tab){document.getElementById('favoritesPanel').style.display=tab==='favorites'?'block':'none';document.getElementById('historyPanel').style.display=tab==='history'?'block':'none';document.getElementById('favTab').classList.toggle('active',tab==='favorites');document.getElementById('historyTab').classList.toggle('active',tab==='history');}
async function save(){try{const user=await getCurrentUser();await updateMember(user.id,{name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim()});document.getElementById('welcome').textContent='Halo, '+(document.getElementById('name').value.trim()||'Member')+' 👋';document.getElementById('msg').textContent='Profil berhasil disimpan.';}catch(e){document.getElementById('msg').textContent=e.message;}}
start();
</script></body></html>
