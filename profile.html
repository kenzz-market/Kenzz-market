<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Member - Kenzz Store</title><style>body{margin:0;background:#08080d;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:20px;box-sizing:border-box}.box{max-width:520px;margin:40px auto;background:#111119;border:1px solid #333;border-radius:20px;padding:24px;box-sizing:border-box}h1{text-align:center;font-size:24px}p{color:#aaa}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#aaa;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;background:#08080d;border:1px solid #333;border-radius:11px;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:12px;margin-top:10px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#20202b}.msg{text-align:center;margin-top:14px;color:#aaa}.links{text-align:center;margin-top:18px}.links a{color:#00ffd5;text-decoration:none}.card{background:#171720;border:1px solid #2d2d38;border-radius:15px;padding:15px;margin-top:12px}.danger{background:#421824}.muted{color:#888;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}</style></head><body><main class="box"><h1>🪪 Profil Member</h1><div id="content">Memuat profil...</div><div class="links"><a href="index.html">← Home</a> · <a href="register.html">Daftar</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>(async()=>{const $=id=>document.getElementById(id),c=$('content');try{const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='register.html';return}const m=await getMemberProfile();if(!m){c.innerHTML='<p>Profil belum tersedia.</p>';return}c.innerHTML=`<div class="card"><div class="muted">Email</div><b>${esc(m.email||user.email||'-')}</b></div><div class="card"><div class="field"><label>Nama</label><input id="name" value="${esc(m.name||'')}"></div><div class="field"><label>No. WhatsApp</label><input id="phone" value="${esc(m.phone||'')}"></div><div class="muted">Provider: ${esc(m.provider||'-')}</div><button class="btn" id="save">Simpan Profil</button><button class="btn danger" id="logout">Keluar</button></div><div id="msg" class="msg"></div>`;$('save').onclick=async()=>{try{const {data:{user}}=await supabaseClient.auth.getUser();await updateMember(user.id,{name:$('name').value.trim(),phone:$('phone').value.trim()});$('msg').textContent='Profil berhasil diperbarui.'}catch(e){$('msg').textContent=e.message}};$('logout').onclick=()=>logoutUser()}catch(e){c.innerHTML='<p>'+esc(e.message)+'</p>'}})();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
