<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profil Member Kenzz Store</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08080d;color:#fff;font-family:'Poppins',sans-serif;padding:20px}.box{max-width:600px;margin:auto;background:#111119;border:1px solid #ffffff22;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0008}h1{font-family:'Orbitron',sans-serif;font-size:22px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#25d36618;color:#7dffbf;border:1px solid #25d36644;font-size:11px;font-weight:700}.row{padding:12px 0;border-bottom:1px solid #ffffff12}.label{font-size:11px;color:#888}.value{font-size:14px;margin-top:3px}.input{width:100%;padding:13px;margin-top:10px;background:#08080d;border:1px solid #333;border-radius:12px;color:#fff;font-family:inherit}.button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:700;font-family:inherit}.danger{background:#ffffff10;border:1px solid #ffffff20}.msg{text-align:center;color:#aaa;margin-top:12px}.back{display:block;color:#fff;text-decoration:none;margin-top:15px;font-size:13px}</style></head><body><div class="box"><h1>🙍 Profil Member <span class="badge">MEMBER</span></h1><div id="account">Memuat...</div><div class="row"><div class="label">Nama</div><input class="input" id="name" placeholder="Nama"></div><div class="row"><div class="label">Email</div><div class="value" id="email">-</div></div><div class="row"><div class="label">Nomor Telepon</div><input class="input" id="phone" placeholder="Nomor HP"></div><div class="row"><div class="label">Metode Akun</div><div class="value" id="provider">-</div></div><div class="row"><div class="label">Bergabung</div><div class="value" id="joined">-</div></div><button class="button" onclick="save()">Simpan Perubahan</button><button class="button danger" onclick="logoutMember()">Keluar</button><p id="msg" class="msg"></p><a class="back" href="index.html">← Kembali ke toko</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
let userId='';async function start(){try{const user=await getCurrentUser();if(!user){location.href='member-login.html';return;}userId=user.id;const p=await ensureMemberProfile();document.getElementById('account').textContent=user.email||user.phone||'Akun member';document.getElementById('email').textContent=user.email||p?.email||'-';document.getElementById('name').value=p?.name||user.user_metadata?.name||'';document.getElementById('phone').value=p?.phone||user.phone||'';document.getElementById('provider').textContent=p?.provider||user.app_metadata?.provider||'-';document.getElementById('joined').textContent=p?.created_at?new Date(p.created_at).toLocaleString('id-ID'):'-';}catch(e){document.getElementById('msg').textContent=e.message;}}
async function save(){try{await updateMember(userId,{name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim()});document.getElementById('msg').textContent='Profil berhasil disimpan.';}catch(e){document.getElementById('msg').textContent=e.message;}}start();</script></body></html>
