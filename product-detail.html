<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Produk • Kenzz Store</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(255,49,111,.18),transparent 30%),linear-gradient(145deg,#070812,#101225);color:#fff;font-family:Poppins,sans-serif}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.back{color:#fff;text-decoration:none;padding:10px 13px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff09}.brand{font-family:Orbitron;font-weight:900;letter-spacing:2px}.brand span{color:#ff316f}.detail{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#121526d9;border:1px solid #ffffff12;border-radius:25px;padding:18px;backdrop-filter:blur(18px)}.photo{width:100%;height:430px;object-fit:cover;border-radius:20px;background:#0b0c15}.info{padding:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#25d36618;border:1px solid #25d36635;color:#7dffbf;font-size:11px;font-weight:800}.info h1{font-size:27px;margin:13px 0 7px}.price{font-size:25px;font-weight:800;color:#00ffd5}.muted{color:#a9aec2;font-size:13px;line-height:1.7}.actions{display:grid;gap:9px;margin-top:20px}.actions button{border:0;border-radius:14px;padding:14px;font:800 13px Poppins;cursor:pointer;color:#fff}.cart{background:#ff316f}.buy{background:#25d366}.fav{background:#ffffff0d;border:1px solid #ffffff18!important}.stock{margin-top:13px;color:#ffd36a;font-size:12px}@media(max-width:700px){.detail{grid-template-columns:1fr}.photo{height:300px}.info h1{font-size:21px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="products.html"><i class="fa-solid fa-arrow-left"></i> Kembali</a><div class="brand">KENZZ <span>STORE</span></div></div><div id="detail" class="detail"><div>Memuat produk...</div></div></div><script src="settings.js"></script><script src="supabase.js"></script><script>
let product=null;
async function start(){const id=new URLSearchParams(location.search).get('id');if(!id){location.href='products.html';return;}try{const products=await getProducts();product=products.find(p=>String(p.id)===String(id));if(!product){document.getElementById('detail').textContent='Produk tidak ditemukan.';return;}const stock=Math.max(0,Number(product.stock||0)),fav=await isFavorite(product.id).catch(()=>false),d=document.getElementById('detail');const img=safeHttpUrl(product.image,'https://via.placeholder.com/700');d.innerHTML=`<img class="photo" src="${escHtml(img)}" alt="${escHtml(product.name||'Produk')}"><div class="info"><span class="badge">${stock>0?'● TERSEDIA':'● CEK KETERSEDIAAN'}</span><h1>${escHtml(product.name||'Produk')}</h1><div class="price">Rp ${Number(product.price||0).toLocaleString('id-ID')}</div><p class="muted">Kategori: ${escHtml(product.category||'-')}<br>${escHtml(product.description||'Produk digital premium Kenzz Store.')}</p><div class="stock">Stok: ${stock>0?stock:'Cek admin'}</div><div class="actions"><button class="cart" onclick="add()"><i class="fa-solid fa-cart-plus"></i> Tambah ke Keranjang</button><button class="buy" onclick="buy()"><i class="fa-brands fa-whatsapp"></i> Beli Sekarang</button><button class="fav" onclick="fav()">${fav?'❤️ Hapus dari Favorit':'♡ Tambah ke Favorit'}</button></div></div>`;}catch(e){console.error(e);document.getElementById('detail').textContent='Gagal memuat produk.';}}
function add(){addToCart(product);alert('Produk masuk keranjang.');}
async function buy(){if(Number(product.stock||0)<1){alert('Stok belum tersedia. Silakan cek ketersediaan ke Owner.');return;}const pending={type:'product',id:String(product.id),name:product.name,qty:1};if(!await requireMemberForPurchase(pending))return;try{const order=await createPurchaseOrder([{id:String(product.id),type:'product',qty:1}],null);clearPendingPurchase();location.href=buildWhatsAppOrderUrl(order);}catch(e){alert('Checkout gagal: '+e.message);}}
async function fav(){try{const active=await toggleFavorite(product);alert(active?'Ditambahkan ke favorit.':'Dihapus dari Favorit.');}catch(e){alert(e.message);}}start();</script></body></html>
