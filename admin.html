<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

padding:20px;

background:#08080d;

color:white;

font-family:Arial,sans-serif;

}



.container{

max-width:900px;

margin:auto;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}



button{

padding:12px;

border:0;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}



.logout{

background:#ff316f;

color:white;

}



.card{

background:#111119;

border:1px solid #333;

border-radius:18px;

padding:20px;

margin-bottom:20px;

}



input{

width:100%;

padding:12px;

margin-top:10px;

background:#08080d;

border:1px solid #333;

border-radius:12px;

color:white;

}



.save{

width:100%;

margin-top:15px;

background:#25d366;

color:white;

}



.product{

display:flex;

gap:15px;

align-items:center;

background:#181823;

padding:15px;

border-radius:15px;

margin-top:12px;

}



.product img{

width:80px;

height:80px;

object-fit:cover;

border-radius:12px;

}



.info{

flex:1;

}



.delete{

background:#ff316f;

color:white;

}



.edit{

background:#ff9d00;

color:white;

}



</style>


</head>


<body>


<div class="container" id="app" style="display:none;">



<div class="header">


<div>


<h1>
👑 Admin Panel
</h1>


<p id="role"></p>


</div>



<button onclick="location.href='members.html'">👥 Member</button>
<button class="logout"
onclick="logoutUser()">

Keluar

</button>


</div>







<div class="card">


<h2>

Tambah / Edit Produk

</h2>



<input id="id"
type="hidden">



<input id="name"
placeholder="Nama produk">



<input id="price"
placeholder="Harga"
type="number">



<input id="category"
placeholder="Kategori">



<input id="image"
placeholder="Link gambar">



<input id="stock"
placeholder="Stok"
type="number">



<button class="save"
onclick="saveProductData()">

Simpan Produk

</button>



</div>







<div class="card">
<h2>🔔 Notifikasi Member</h2>
<div id="notifications">Memuat...</div>
<button class="save" onclick="markAllNotificationsAsRead();loadNotifications();">Tandai semua dibaca</button>
</div>

<div class="card">
<h2>👥 Ringkasan Member</h2>
<p id="memberTotal">Memuat...</p>
<a href="members.html" style="color:#fff">Lihat semua member →</a>
</div>

<div class="card">


<h2>
📦 Daftar Produk
</h2>


<div id="list">

Memuat...

</div>



</div>






</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="settings.js"></script>

<script src="supabase.js"></script>



<script>



async function loadNotifications(){
    const box=document.getElementById("notifications");
    try{
        const notes=await getOwnerNotifications(true);
        box.innerHTML=notes.length ? notes.map(n=>`
            <div style="padding:12px 0;border-bottom:1px solid #333">
              <b>${n.title||"Notifikasi"}</b>
              <p style="margin:6px 0;color:#aaa">${n.message||""}</p>
              <small style="color:#777">${new Date(n.created_at).toLocaleString("id-ID")}</small>
              <button style="margin-top:8px" onclick="markNotificationAsRead('${n.id}').then(loadNotifications)">Tandai dibaca</button>
            </div>`).join("") : "Tidak ada notifikasi baru.";
    }catch(e){box.textContent=e.message;}
}
async function loadMemberTotal(){
    try{
        const n=await getMemberCount();
        document.getElementById("memberTotal").textContent=n+" member terdaftar";
    }catch(e){document.getElementById("memberTotal").textContent="Gagal memuat member";}
}

async function start(){



const role =

await checkRole();



if(
role !== "owner"
&&
role !== "admin"
){


alert(
"Akses ditolak"
);


location.href =
"login.html";


return;

}




document
.getElementById("app")
.style.display="block";



document
.getElementById("role")
.innerHTML =

"Role: "
+
role;



loadProducts();
loadNotifications();
loadMemberTotal();


}





async function loadProducts(){



const products =

await getProducts();



const box =

document
.getElementById("list");



if(!products.length){


box.innerHTML =
"Tidak ada produk";


return;


}




box.innerHTML =

products.map(p=>`



<div class="product">


<img src="${p.image || 'https://via.placeholder.com/100'}">



<div class="info">


<h3>

${p.name}

</h3>



<p>

Rp ${Number(p.price)
.toLocaleString("id-ID")}

</p>


<p>

${p.category}

|

Stok:
${p.stock}

</p>



</div>



<button class="edit"

onclick='editProduct(${JSON.stringify(p)})'>

Edit

</button>



<button class="delete"

onclick="removeProduct('${p.id}')">

Hapus

</button>



</div>



`).join("");



}








async function saveProductData(){



const id =

document
.getElementById("id")
.value;



const data = {


name:

document
.getElementById("name")
.value,


price:

Number(
document
.getElementById("price")
.value
),


category:

document
.getElementById("category")
.value,


image:

document
.getElementById("image")
.value,


stock:

Number(
document
.getElementById("stock")
.value
)


};





if(id){


await updateProduct(
id,
data
);


}else{


await addProduct(
data
);


}



alert(
"Produk tersimpan"
);



clearForm();


loadProducts();


}





function editProduct(p){


document
.getElementById("id")
.value=p.id;


document
.getElementById("name")
.value=p.name;


document
.getElementById("price")
.value=p.price;


document
.getElementById("category")
.value=p.category;


document
.getElementById("image")
.value=p.image;


document
.getElementById("stock")
.value=p.stock;


}





function clearForm(){


document
.querySelectorAll("input")
.forEach(
x=>x.value=""
);


}





async function removeProduct(id){


if(
confirm("Hapus produk?")
){


await deleteProduct(id);


loadProducts();


}


}





start();


</script>


</body>

</html>
