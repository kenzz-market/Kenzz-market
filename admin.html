<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#08080d;
color:white;

}



.container{

max-width:600px;
margin:auto;
background:#111119;
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,.1);

}



h1{

text-align:center;

}



input{

width:100%;
padding:13px;
margin:8px 0;
border-radius:12px;
border:1px solid #333;
background:#08080d;
color:white;

}



button{

padding:12px;
border:0;
border-radius:12px;
cursor:pointer;
font-weight:bold;

}



.add{

width:100%;
background:linear-gradient(135deg,#ff316f,#ff9d00);
color:white;

}



.logout{

background:#333;
color:white;
margin-bottom:15px;

}



.product{

display:flex;
gap:12px;
align-items:center;
background:#181823;
padding:12px;
border-radius:15px;
margin-top:12px;

}



.product img{

width:70px;
height:70px;
object-fit:cover;
border-radius:10px;

}



.info{

flex:1;

}



.info h3{

margin:0;

}



.info p{

margin:5px 0;
color:#aaa;

}



.delete{

background:#ff405f;
color:white;

}



#status{

text-align:center;
margin:15px 0;

}



</style>

</head>


<body>


<div class="container">


<h1>👑 Admin Kenzz Store</h1>


<button class="logout" onclick="logout()">
Keluar
</button>



<input id="name"
placeholder="Nama Produk">


<input id="price"
type="number"
placeholder="Harga">


<input id="category"
placeholder="Kategori">


<input id="image"
placeholder="Link Gambar">


<input id="stock"
type="number"
placeholder="Stok">



<button class="add" onclick="saveProduct()">
+ Tambah Produk
</button>



<div id="status"></div>


<h2>📦 Produk</h2>


<div id="list">
Memuat...
</div>



</div>



<script src="supabase.js"></script>


<script>


const admin =
localStorage.getItem("kenzz_admin");



if(!admin){

alert("Akses ditolak");

window.location.href="login.html";

}




function logout(){

localStorage.removeItem("kenzz_admin");

window.location.href="login.html";

}




async function saveProduct(){



const data={


name:
document.getElementById("name").value,


price:
Number(
document.getElementById("price").value
),


category:
document.getElementById("category").value,


image:
document.getElementById("image").value,


stock:
Number(
document.getElementById("stock").value
)


};



try{


await addProduct(data);


alert("Produk berhasil ditambahkan");


loadProducts();



}catch(error){


alert(error.message);


}



}




async function loadProducts(){


const list=
document.getElementById("list");


try{


const products =
await getProducts();



if(!products.length){

list.innerHTML=
"Tidak ada produk";

return;

}



list.innerHTML =
products.map(p=>`


<div class="product">


<img src="${p.image || 'https://via.placeholder.com/100'}">


<div class="info">

<h3>${p.name}</h3>

<p>
Rp ${Number(p.price).toLocaleString("id-ID")}
</p>

<p>
${p.category} | Stok ${p.stock}
</p>

</div>


<button class="delete"
onclick="removeProduct('${p.id}')">

Hapus

</button>


</div>


`).join("");



}catch(error){


list.innerHTML=
"Gagal mengambil produk";


}



}




async function removeProduct(id){


if(!confirm("Hapus produk ini?"))
return;



try{


await deleteProduct(id);


alert("Produk dihapus");


loadProducts();



}catch(error){


alert(error.message);


}



}



loadProducts();


</script>


</body>
</html>
