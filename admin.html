<!DOCTYPE html>
<html><body>

<input id="stock" placeholder="Stok">
<button onclick="save()">Tambah</button>

async function save(){
 await addProduct({

  stock:Number(stock.value)
 });
 alert("Produk masuk database");
}
</script>
