<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel • Kenzz Store</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
:root{--pink:#ff316f;--cyan:#00ffd5;--green:#25d366;--panel:rgba(12,12,20,.86);--line:rgba(255,255,255,.10)}
body{margin:0;padding:24px;min-height:100vh;color:#fff;font-family:Poppins,sans-serif;background:#07070c center/cover fixed no-repeat;position:relative}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(5,5,10,.90),rgba(8,8,15,.72));z-index:-1}
.container{max-width:1180px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.brand h1{margin:0;font-family:Orbitron,sans-serif;letter-spacing:1px}.brand p{margin:6px 0 0;color:#aaa}.header-actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:11px 14px;border:0;border-radius:12px;cursor:pointer;font-weight:700;color:#fff}.logout,.danger{background:var(--pink)}.secondary{background:#181823;border:1px solid #333}.primary{background:linear-gradient(135deg,var(--pink),#ff6b9a)}.success{background:var(--green)}.card{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 14px 40px rgba(0,0,0,.22)}.card h2{margin-top:0}.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:16px;border-radius:16px}.stat b{display:block;font-size:24px;color:var(--cyan)}.stat span{color:#aaa;font-size:12px}.owner-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.nav-btn{background:#12121c;border:1px solid var(--line);min-height:70px}.nav-btn.active{border-color:var(--pink);background:rgba(255,49,111,.12)}.owner-section{display:none}.owner-section.active{display:block}input,select,textarea{width:100%;padding:12px;margin-top:9px;background:#08080d;border:1px solid #333;border-radius:12px;color:#fff;font-family:inherit}textarea{min-height:90px;resize:vertical}.save{width:100%;margin-top:14px;background:var(--green)}.product,.member-row,.admin-row,.note-row{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.045);padding:14px;border-radius:15px;margin-top:10px;border:1px solid rgba(255,255,255,.06)}.product img{width:72px;height:72px;object-fit:cover;border-radius:12px}.info{flex:1}.info h3{margin:0 0 5px}.info p{margin:4px 0;color:#aaa}.delete{background:var(--pink)}.edit{background:#ff9d00}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tab-btn{background:#15151f;color:#fff;border:1px solid #333}.tab-btn.active{background:var(--pink)}.section{display:none}.section.active{display:block}.promo-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:700}.countdown{color:#ffd36a;font-weight:700}.hint{color:#888;font-size:12px;line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px;margin-top:0}.empty{text-align:center;color:#888;padding:25px}.background-preview{height:150px;border-radius:16px;margin-top:12px;background:#111 center/cover no-repeat;border:1px solid var(--line)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(0,255,213,.1);color:var(--cyan);font-size:11px}.mobile-stack{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.owner-nav{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:14px}.dashboard-grid{grid-template-columns:1fr 1fr}.owner-nav{grid-template-columns:1fr 1fr}.product,.member-row,.admin-row,.note-row{align-items:flex-start;flex-wrap:wrap}.product img{width:58px;height:58px}.product .info{min-width:calc(100% - 75px)}}
</style></head><body><div class="container" id="app" style="display:none;">
<div class="header"><div class="brand"><h1>🛡️ ADMIN PANEL</h1><p id="role">Kenzz Store Management</p></div><div class="header-actions"><button class="secondary" onclick="location.href='index.html'">🏠 Toko</button><button class="logout" onclick="logoutUser()">Keluar</button></div></div>
<div class="dashboard-grid"><div class="stat"><b id="productTotal">0</b><span>Produk biasa</span></div><div class="stat"><b id="promoTotal">0</b><span>Promo aktif</span></div></div>
<div class="owner-nav" style="grid-template-columns:1fr 1fr"><button class="nav-btn active" onclick="showAdminSection('products',this)">📦<br>Katalog Biasa</button><button class="nav-btn" onclick="showAdminSection('promo',this)">🔥<br>Katalog Promo</button></div>
<section id="productsSection" class="owner-section active"><div class="card"><h2>📦 Tambah / Edit Produk Biasa</h2><input id="id" type="hidden"><input id="name" placeholder="Nama produk, contoh: Canva Pro 1 Bulan"><input id="price" placeholder="Harga" type="number"><input id="category" placeholder="Kategori"><input id="image" placeholder="Link gambar"><input id="stock" placeholder="Stok" type="number"><button class="save" onclick="saveProductData()">Simpan Produk</button></div><div class="card"><h2>📦 Daftar Produk Biasa</h2><div id="list">Memuat...</div></div></section>
<section id="promoSection" class="owner-section"><div class="card"><h2>🔥 Buat Katalog Produk Promo</h2><input id="promoId" type="hidden"><input id="promoName" placeholder="Nama produk promo, contoh: Canva Pro 1 Bulan"><input id="promoPrice" placeholder="Harga promo" type="number"><input id="promoCategory" placeholder="Kategori"><input id="promoImage" placeholder="Link gambar"><input id="promoStock" placeholder="Stok promo" type="number"><select id="promoDuration"><option value="30">30 Menit</option><option value="60" selected>1 Jam</option><option value="180">3 Jam</option><option value="360">6 Jam</option><option value="720">12 Jam</option><option value="1440">24 Jam</option></select><button class="save" onclick="savePromoData()">🔥 Mulai / Simpan Promo</button></div><div class="card"><h2>🔥 Promo Aktif</h2><div id="promoList">Memuat...</div></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="settings.js"></script><script src="supabase.js"></script>
<script src="mega-features.js"></script><script>
function showAdminSection(name,btn){document.querySelectorAll('.owner-section').forEach(x=>x.classList.remove('active'));document.getElementById(name+'Section').classList.add('active');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');}
function loadProductsAdmin(products){const box=document.getElementById('list');box.innerHTML=products.length?products.map(p=>`<div class="product"><img src="${p.image||'https://via.placeholder.com/100'}"><div class="info"><h3>${p.name}</h3><p>Rp ${Number(p.price||0).toLocaleString('id-ID')}</p><p>${p.category||'-'} · Stok: ${p.stock||0}</p></div><button class="edit" onclick='editProduct(${JSON.stringify(p)})'>Edit</button><button class="delete" onclick="removeProduct('${p.id}')">Hapus</button></div>`).join(''):'<div class="empty">Belum ada produk.</div>';}
async function loadPromosAdmin(promos){const box=document.getElementById('promoList');const now=Date.now();promos=(promos||[]).filter(p=>p.is_active&&new Date(p.expires_at).getTime()>now);box.innerHTML=promos.length?promos.map(p=>`<div class="product"><img src="${p.image||'https://via.placeholder.com/100'}"><div class="info"><h3>${p.name}</h3><p>Rp ${Number(p.price||0).toLocaleString('id-ID')} · Stok ${p.stock||0}</p><span class="promo-badge">PROMO</span><p class="countdown" data-expires="${p.expires_at}">⏱ ${promoRemaining(p.expires_at)}</p></div><button class="edit" onclick='editPromo(${JSON.stringify(p)})'>Edit</button><button class="delete" onclick="removePromo('${p.id}')">Hapus</button></div>`).join(''):'<div class="empty">Tidak ada promo aktif.</div>';}
function promoRemaining(expires){const ms=new Date(expires).getTime()-Date.now();if(ms<=0)return 'Berakhir';const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function editProduct(p){document.getElementById('id').value=p.id;document.getElementById('name').value=p.name||'';document.getElementById('price').value=p.price||0;document.getElementById('category').value=p.category||'';document.getElementById('image').value=p.image||'';document.getElementById('stock').value=p.stock||0;window.scrollTo({top:0,behavior:'smooth'});}
function clearProductForm(){['id','name','price','category','image','stock'].forEach(x=>document.getElementById(x).value='');}
async function saveProductData(){try{const id=document.getElementById('id').value;const data={name:document.getElementById('name').value.trim(),price:Number(document.getElementById('price').value||0),category:document.getElementById('category').value.trim(),image:document.getElementById('image').value.trim(),stock:Number(document.getElementById('stock').value||0)};if(!data.name)return alert('Nama produk wajib diisi');if(id)await updateProduct(id,data);else await addProduct(data);clearProductForm();await refresh();alert('Produk tersimpan.');}catch(e){alert('Gagal menyimpan produk: '+e.message)}}
async function removeProduct(id){if(confirm('Hapus produk ini?')){try{await deleteProduct(id);await refresh()}catch(e){alert(e.message)}}}
function editPromo(p){document.getElementById('promoId').value=p.id;document.getElementById('promoName').value=p.name||'';document.getElementById('promoPrice').value=p.price||0;document.getElementById('promoCategory').value=p.category||'';document.getElementById('promoImage').value=p.image||'';document.getElementById('promoStock').value=p.stock||0;document.getElementById('promoDuration').value='60';}
function clearPromoForm(){['promoId','promoName','promoPrice','promoCategory','promoImage','promoStock'].forEach(id=>document.getElementById(id).value='');document.getElementById('promoDuration').value='60'}
async function savePromoData(){try{const id=document.getElementById('promoId').value;const minutes=Number(document.getElementById('promoDuration').value||60);const data={name:document.getElementById('promoName').value.trim(),price:Number(document.getElementById('promoPrice').value||0),category:document.getElementById('promoCategory').value.trim(),image:document.getElementById('promoImage').value.trim(),stock:Number(document.getElementById('promoStock').value||0),is_active:true,expires_at:new Date(Date.now()+minutes*60000).toISOString()};if(!data.name)return alert('Nama promo wajib diisi');if(id)await updatePromoProduct(id,data);else await addPromoProduct(data);clearPromoForm();await refresh();alert('Promo tersimpan.')}catch(e){alert('Gagal menyimpan promo: '+e.message)}}
async function removePromo(id){if(confirm('Hapus promo ini?')){try{await deletePromoProduct(id);await refresh()}catch(e){alert(e.message)}}}
async function refresh(){const [p,pr]=await Promise.all([getProducts(),getPromoProducts()]);document.getElementById('productTotal').textContent=p.length;document.getElementById('promoTotal').textContent=pr.length;loadProductsAdmin(p);loadPromosAdmin(pr);}
setInterval(()=>document.querySelectorAll('[data-expires]').forEach(e=>e.textContent='⏱ '+promoRemaining(e.dataset.expires)),1000);
(async function(){try{const role=await checkRole();if(role!=='admin'){alert('Akses ditolak. Halaman ini khusus Admin.');location.href='admin-login.html';return;}document.getElementById('app').style.display='block';document.getElementById('role').textContent='Role: ADMIN · Operasional';await refresh();}catch(e){alert('Gagal membuka Admin Panel: '+e.message);location.href='admin-login.html';}})();
</script></body></html>
