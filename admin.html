<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;
background:#08080d;
color:white;
font-family:Arial,sans-serif;

}


.container{

max-width:650px;
margin:auto;
background:#111119;
padding:25px;
border-radius:20px;
border:1px solid #333;

}



h1{

text-align:center;

}



.top{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}



.role{

color:#55e98e;
font-size:14px;

}



button{

padding:12px;
border:0;
border-radius:12px;
cursor:pointer;
font-weight:bold;

}



.logout{

background:#333;
color:white;

}



input{

width:100%;
padding:13px;
margin:7px 0;
background:#08080d;
border:1px solid #333;
border-radius:12px;
color:white;

}



.add{

width:100%;
margin-top:10px;
background:linear-gradient(
135deg,
#ff316f,
#ff9d00
);
color:white;

}



.product{

display:flex;
gap:12px;
align-items:center;
background:#181823;
padding:12px;
margin-top:12px;
border-radius:15px;

}



.product img{

width:70px;
height:70px;
border-radius:10px;
object-fit:cover;

}



.info{

flex:1;

}



.info h3{

margin:0;

}



.info p{

color:#aaa;
margin:5px 0;

}



.delete{

background:#ff315f;
color:white;

}



</style>


</head>


<body>


<div class="container" id="panel" style="display:none;">


<div class="top">

<div>

<h1>
👑 Admin
</h1>

<span class="role" id="role"></span>

</div>


<button class="logout"
onclick="logoutUser()">

Keluar

</button>


</div>



<input 
id="name"
placeholder="Nama produk">



<input 
id="price"
type="number"
placeholder="Harga">



<input 
id="category"
placeholder="Kategori">



<input 
id="image"
placeholder="Link gambar">



<input 
id="stock"
type="number"
placeholder="Stok">



<button class="add"
onclick="saveProduct()">

+ Tambah Produk

</button>



<h2>
📦 Produk
</h2>


<div id="list">

Memuat...

</div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


async function checkAccess(){


const role =
await checkRole();



if(
role !== "owner" &&
role !== "admin"
){


alert(
"Akses ditolak"
);


location.href="login.html";


return;

}



document
.getElementById("panel")
.style.display="block";


document
.getElementById("role")
.innerHTML=
"Role: "+role;



loadProducts();


}



async function saveProduct(){



const data={

name:
document.getElementById("name").value,

price:
Number(
document.getElementById("price").value
),

category:
document.getElementById("category").value,

image:
document.getElementById("image").value,

stock:
Number(
document.getElementById("stock").value
)

};



await addProduct(data);


alert(
"Produk ditambahkan"
);


loadProducts();


}




async function loadProducts(){


const list =
document.getElementById("list");


const products =
await getProducts();



list.innerHTML =
products.map(p=>`


<div class="product">


<img src="${p.image}">


<div class="info">

<h3>
${p.name}
</h3>

<p>
Rp ${Number(p.price).toLocaleString("id-ID")}
</p>

<p>
${p.category}
</p>

</div>


<button class="delete"
onclick="removeProduct('${p.id}')">

Hapus

</button>


</div>


`).join("");



}




async function removeProduct(id){


if(
confirm("Hapus produk?")
){


await deleteProduct(id);


loadProducts();


}


}



checkAccess();


</script>


</body>

</html>
