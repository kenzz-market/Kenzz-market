<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login Member Kenzz Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08080d;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:390px;background:#111119;border:1px solid #333;border-radius:22px;padding:25px}h2{text-align:center;margin-top:0}input{width:100%;padding:13px;margin-top:10px;background:#08080d;border:1px solid #333;border-radius:12px;color:#fff}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff316f,#ff9d00);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#ffffff12;border:1px solid #ffffff20}.msg{text-align:center;color:#aaa;margin-top:14px;font-size:14px}.small{text-align:center;color:#aaa;font-size:13px}.back{display:block;text-align:center;margin-top:15px;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>👤 Login Member</h2>
<input id="email" type="email" placeholder="Email terdaftar">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Masuk</button>
<div id="msg" class="msg"></div>
<p class="small">Belum punya akun? <a href="register.html" style="color:#fff">Daftar member</a></p>
<a class="back" href="index.html">← Kembali ke toko</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="settings.js"></script>
<script src="supabase.js"></script>
<script>
async function login(){
 const msg=document.getElementById('msg');
 try{
  msg.textContent='Memeriksa akun...';
  await loginMember(document.getElementById('email').value.trim(),document.getElementById('password').value);
  if(await resumePendingPurchase()) return;
  location.href='profile.html';
 }catch(e){msg.textContent=e.message;}
}
</script>
</body>
</html>
