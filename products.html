<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Katalog Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;

background:#08080d;

color:white;

font-family:Arial,sans-serif;

}



.container{

max-width:1000px;

margin:auto;

}



h1{

text-align:center;

}



.top{

display:flex;

gap:10px;

margin-bottom:20px;

}



input{

flex:1;

padding:14px;

border-radius:12px;

border:1px solid #333;

background:#111119;

color:white;

}



.category{

display:flex;

gap:10px;

flex-wrap:wrap;

margin:20px 0;

}



.category button{

padding:10px 15px;

border-radius:20px;

border:1px solid #333;

background:#15151f;

color:white;

cursor:pointer;

}



.category button.active{

background:#ff316f;

}



.products{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

}



.card{

background:#111119;

border:1px solid rgba(255,255,255,.1);

border-radius:18px;

padding:15px;

}



.card img{

width:100%;

height:200px;

object-fit:cover;

border-radius:12px;

}



.card h3{

margin:7px 0 5px;
font-size:14px;

}



.price{

color:#00ffd5;

font-size:20px;

font-weight:bold;

}



.info{

color:#aaa;

}



button.buy,
button.cart{


width:100%;

padding:12px;

margin-top:10px;

border:0;

border-radius:12px;

font-weight:bold;

cursor:pointer;


}



.buy{

background:#25d366;

color:white;

}



.cart{

background:#ff316f;

color:white;

}



.availability{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin:2px 0 4px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}
.availability.available{
  color:#7dffbf;
  background:rgba(37,211,102,.12);
  border:1px solid rgba(37,211,102,.25);
}
.availability.check{
  color:#ffd36a;
  background:rgba(255,193,7,.10);
  border:1px solid rgba(255,193,7,.22);
}

.promo-section{margin-bottom:24px;}
.promo-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;}
.promo-title span{color:#ff9d00;font-size:13px;}
.promo-products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.promo-card{background:linear-gradient(180deg,#17111b,#111119);border:1px solid rgba(255,49,111,.35);border-radius:18px;padding:12px;position:relative;}
.promo-card img{width:100%;height:150px;object-fit:cover;border-radius:12px;}
.promo-badge{display:inline-block;background:#ff316f;color:#fff;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-top:7px;}
.promo-old{text-decoration:line-through;color:#777;font-size:12px;}
.promo-price{color:#00ffd5;font-size:18px;font-weight:800;}
.promo-countdown{color:#ffd36a;font-size:11px;font-weight:700;margin-top:4px;}
.empty{

text-align:center;

padding:40px;

color:#aaa;

}



@media(max-width:600px){

.products{

grid-template-columns:repeat(2,1fr);

}

}


</style>


</head>


<body>


<div class="container">


<h1>
🛒 Kenzz Store
</h1>



<div class="top">


<input

id="search"

placeholder="Cari produk...">


</div>




<div id="promoSection" class="promo-section">
<h2 class="promo-title">🔥 Produk Promo <span>Harga & waktu terbatas</span></h2>
<div id="promoProducts" class="promo-products"><div class="empty">Memuat promo...</div></div>
</div>

<div class="category">


<button class="active"
onclick="filterCategory('Semua',this)">
Semua
</button>


<button onclick="filterCategory('Apk premium',this)">
Apk premium
</button>


<button onclick="filterCategory('Panel',this)">
Panel
</button>


<button onclick="filterCategory('Nokos',this)">
Nokos
</button>


<button onclick="filterCategory('Sewa Bot',this)">
Sewa Bot
</button>



</div>




<div id="products"
class="products">

<div class="empty">

Memuat produk...

</div>


</div>



</div>





<script src="settings.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>



<script>


let allProducts=[];

let activeCategory="Semua";





async function loadPromos(){
  try{
    const promos=await getPromoProducts();
    renderPromos(promos);
  }catch(e){document.getElementById('promoProducts').innerHTML='<div class="empty">Promo belum tersedia</div>';}
}
function remainingPromo(expires){
  const ms=new Date(expires).getTime()-Date.now();
  if(ms<=0)return '00:00:00';
  const total=Math.floor(ms/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function renderPromos(promos){
  const box=document.getElementById('promoProducts');
  if(!promos.length){box.innerHTML='<div class="empty">Belum ada produk promo aktif</div>';return;}
  box.innerHTML=promos.map(p=>{
    const stock=Number(p.stock||0);
    return `<div class="promo-card"><img src="${p.image||'https://via.placeholder.com/300'}"><span class="promo-badge">🔥 PROMO</span><h3>${p.name}</h3><div class="promo-price">Rp ${Number(p.price||0).toLocaleString('id-ID')}</div><div class="promo-countdown" data-promo-expires="${p.expires_at}">⏱ ${remainingPromo(p.expires_at)}</div><div class="availability ${stock>0?'available':'check'}">● ${stock>0?'Tersedia':'Cek Ketersediaan'}</div><p class="info">Kategori: ${p.category||'-'}<br>Stok: ${stock>0?stock:'Cek admin'}</p><button class="buy" onclick='buyPromo(${JSON.stringify(p)})'>💬 Beli Sekarang</button></div>`;
  }).join('');
}
async function buyPromo(p){
  const stock=Number(p.stock||0); if(stock<1){alert('Promo ini sudah habis.');return;}
  const ok=await requireMemberForPurchase({type:'promo',id:p.id,name:p.name,price:Number(p.price||0),qty:1});
  if(!ok)return;
  try{
    const updated=await decrementPromoStock(p.id,1);
    if(!updated){alert('Promo sudah habis.');loadPromos();return;}
    openWhatsAppPurchase({id:p.id,name:p.name,price:Number(p.price||0),qty:1});
  }catch(e){console.error(e);alert('Stok promo belum dapat dikurangi. Silakan coba lagi.');}
}
setInterval(()=>document.querySelectorAll('[data-promo-expires]').forEach(e=>{e.textContent='⏱ '+remainingPromo(e.dataset.promoExpires);}),1000);

// LOAD PRODUK


async function loadProducts(){


try{


allProducts =
await getProducts();


render();


}


catch(error){


console.log(error);


document
.getElementById("products")
.innerHTML=

`
<div class="empty">
Produk gagal dimuat
</div>
`;

}


}





// FILTER


function filterCategory(cat,btn){


activeCategory=cat;


document
.querySelectorAll(".category button")
.forEach(x=>
x.classList.remove("active")
);


btn.classList.add("active");


render();


}





// SEARCH


document
.getElementById("search")
.addEventListener(
"input",
render
);





function render(){


let keyword =

document
.getElementById("search")
.value
.toLowerCase();



let data =
allProducts.filter(p=>{


let matchText =

(
p.name+
p.category
)

.toLowerCase()

.includes(keyword);



let matchCategory =

activeCategory==="Semua"

||

p.category===activeCategory;



return matchText && matchCategory;


});




let box =
document.getElementById("products");



if(!data.length){


box.innerHTML=

`
<div class="empty">
Produk belum tersedia
</div>
`;

return;


}





box.innerHTML =

data.map(p=>{


const stock = Number(p.stock ?? 0);
let availability = stock > 0
  ? '<span class="availability available">● Tersedia</span>'
  : '<span class="availability check">● Cek Ketersediaan</span>';


return `


<div class="card">


<img src="${p.image || 'https://via.placeholder.com/300'}">


<h3>
${p.name}
</h3>


<div class="price">

Rp ${Number(p.price)
.toLocaleString("id-ID")}

</div>

${availability}

<p class="info">

Kategori:
${p.category}

<br>

Stok: ${stock > 0 ? stock : "Cek admin"}

</p>



<button class="cart"

onclick='addProductCart(${JSON.stringify(p)})'>

🛒 Tambah Keranjang

</button>



<button class="buy" onclick='buyProduct(${JSON.stringify(p)})'>
💬 Beli Sekarang
</button>



</div>


`;



}).join("");



}





function addProductCart(product){


addToCart(product);


alert(
"Produk masuk keranjang"
);


}


async function buyProduct(product){
    const ok = await requireMemberForPurchase({
        type: "product",
        name: product.name,
        price: Number(product.price || 0),
        qty: 1
    });
    if(ok){
        try{
            const updated = await decrementProductStock(product.id, 1);
            if(!updated){
                alert('Stok produk sudah habis atau tidak mencukupi. Silakan cek produk lain.');
                await loadProducts();
                return;
            }
            openWhatsAppPurchase({
                id: product.id,
                name: product.name,
                price: Number(product.price || 0),
                qty: 1
            });
        }catch(e){
            console.error(e);
            alert('Stok belum dapat dikurangi. Silakan coba lagi.');
        }
    }
}




loadPromos();
loadProducts();


</script>


</body>

</html>
