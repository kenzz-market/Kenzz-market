<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Katalog Kenzz Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;

background:#08080d;

color:white;

font-family:Arial,sans-serif;

}



.container{

max-width:1000px;

margin:auto;

}



h1{

text-align:center;

}



.top{

display:flex;

gap:10px;

margin-bottom:20px;

}



input{

flex:1;

padding:14px;

border-radius:12px;

border:1px solid #333;

background:#111119;

color:white;

}



.category{

display:flex;

gap:10px;

flex-wrap:wrap;

margin:20px 0;

}



.category button{

padding:10px 15px;

border-radius:20px;

border:1px solid #333;

background:#15151f;

color:white;

cursor:pointer;

}



.category button.active{

background:#ff316f;

}



.products{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}



.card{

background:#111119;

border:1px solid rgba(255,255,255,.1);

border-radius:18px;

padding:15px;

}



.card img{

width:100%;

height:200px;

object-fit:cover;

border-radius:12px;

}



.card h3{

margin:10px 0;

}



.price{

color:#00ffd5;

font-size:20px;

font-weight:bold;

}



.info{

color:#aaa;

}



button.buy,
button.cart{


width:100%;

padding:12px;

margin-top:10px;

border:0;

border-radius:12px;

font-weight:bold;

cursor:pointer;


}



.buy{

background:#25d366;

color:white;

}



.cart{

background:#ff316f;

color:white;

}



.empty{

text-align:center;

padding:40px;

color:#aaa;

}



@media(max-width:600px){

.products{

grid-template-columns:1fr;

}

}


</style>


</head>


<body>


<div class="container">


<h1>
🛒 Kenzz Store
</h1>



<div class="top">


<input

id="search"

placeholder="Cari produk...">


</div>




<div class="category">


<button class="active"
onclick="filterCategory('Semua',this)">
Semua
</button>


<button onclick="filterCategory('APK Premium',this)">
APK Premium
</button>


<button onclick="filterCategory('Panel',this)">
Panel
</button>


<button onclick="filterCategory('Nokos',this)">
Nokos
</button>


<button onclick="filterCategory('Sewa Bot',this)">
Sewa Bot
</button>



</div>




<div id="products"
class="products">

<div class="empty">

Memuat produk...

</div>


</div>



</div>





<script src="settings.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>



<script>


let allProducts=[];

let activeCategory="Semua";




// LOAD PRODUK


async function loadProducts(){


try{


allProducts =
await getProducts();


render();


}


catch(error){


console.log(error);


document
.getElementById("products")
.innerHTML=

`
<div class="empty">
Produk gagal dimuat
</div>
`;

}


}





// FILTER


function filterCategory(cat,btn){


activeCategory=cat;


document
.querySelectorAll(".category button")
.forEach(x=>
x.classList.remove("active")
);


btn.classList.add("active");


render();


}





// SEARCH


document
.getElementById("search")
.addEventListener(
"input",
render
);





function render(){


let keyword =

document
.getElementById("search")
.value
.toLowerCase();



let data =
allProducts.filter(p=>{


let matchText =

(
p.name+
p.category
)

.toLowerCase()

.includes(keyword);



let matchCategory =

activeCategory==="Semua"

||

p.category===activeCategory;



return matchText && matchCategory;


});




let box =
document.getElementById("products");



if(!data.length){


box.innerHTML=

`
<div class="empty">
Produk belum tersedia
</div>
`;

return;


}





box.innerHTML =

data.map(p=>{


let message =

encodeURIComponent(

`Halo ${STORE_SETTINGS.storeName},

Saya ingin membeli:

Produk:
${p.name}

Harga:
Rp ${Number(p.price).toLocaleString("id-ID")}

Terima kasih.`

);



return `


<div class="card">


<img src="${p.image || 'https://via.placeholder.com/300'}">


<h3>
${p.name}
</h3>


<div class="price">

Rp ${Number(p.price)
.toLocaleString("id-ID")}

</div>



<p class="info">

Kategori:
${p.category}

<br>

Stok:
${p.stock}

</p>



<button class="cart"

onclick='addProductCart(${JSON.stringify(p)})'>

🛒 Tambah Keranjang

</button>



<a href="https://wa.me/${STORE_SETTINGS.whatsappOwner}?text=${message}"

target="_blank">


<button class="buy">

💬 Beli Sekarang

</button>


</a>



</div>


`;



}).join("");



}





function addProductCart(product){


addToCart(product);


alert(
"Produk masuk keranjang"
);


}




loadProducts();


</script>


</body>

</html>
