<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Detail Anime • Kenzz Store</title><style>
:root{color-scheme:dark;--bg:#111217;--panel:#15161d;--line:#34353e;--muted:#a5a8b4;--blue:#a6ccff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f2f6;font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding-bottom:36px}.top{height:68px;display:flex;align-items:center;gap:20px;padding:0 18px}.back,.bookmark,.more{background:none;border:0;color:#ddd;font-size:25px;cursor:pointer}.name{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}.tab{position:relative;flex:0 0 auto;border:0;background:none;color:#b9bbc5;padding:16px 18px;font:inherit}.tab.active{color:var(--blue)}.tab.active:after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:4px;background:var(--blue);border-radius:4px 4px 0 0}.content{padding:20px}.hero{display:grid;grid-template-columns:138px 1fr;gap:20px;align-items:center}.poster{width:138px;height:194px;object-fit:cover;border-radius:4px;background:#252630}.title{font-size:23px;line-height:1.25;margin:3px 0 2px}.english{font-size:17px;color:#d7d7df}.date{font-size:13px;color:#c4c6d0}.score{margin-top:12px;color:#c5c6d0}.score strong{font-size:19px;color:#f2f2f5}.subscore{font-size:13px;color:var(--muted);margin-top:3px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:22px 0 26px}.fact label{display:block;font-size:12px;color:#b6b8c3}.fact div{font-size:14px}.countbox{border:1px solid var(--line);border-radius:17px;text-align:center;padding:12px 8px;margin:20px -4px 22px;color:#d8d9e1}.countlabel{font-weight:650;font-size:14px}.timegrid{display:flex;justify-content:center;gap:22px;margin-top:3px}.timegrid strong{display:block;font-size:18px;font-weight:500}.timegrid span{font-size:12px}.description{font-size:17px;line-height:1.38;white-space:pre-line;margin:22px 0 36px}.section{margin:26px 0}.section h3{font-size:16px;font-weight:500;margin:0 0 12px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid #666a76;border-radius:10px;padding:9px 15px;color:#e0e1e7;background:transparent}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}.links a{border:1px solid #555966;border-radius:30px;padding:12px;text-align:center;text-decoration:none;color:#b7d1ff}.related{display:flex;gap:12px;overflow-x:auto}.related a{flex:0 0 140px;color:#e3e3ea;text-decoration:none;border:1px solid #3b3d46;border-radius:13px;overflow:hidden}.related img{width:100%;height:190px;object-fit:cover;display:block}.related div{padding:8px;font-size:14px}.related small{color:#aaa}.external{display:grid;grid-template-columns:1fr 1fr;gap:10px}.external a{border-radius:28px;padding:14px;text-align:center;text-decoration:none;color:#f3f4f8;background:#25334b}.state{padding:35px 20px;color:#b9bbc6;text-align:center}.hide{display:none!important}.video-link{color:#b8d1ff}.detail-fav.on{color:#a8ceff}@media(max-width:520px){.content{padding:20px}.hero{grid-template-columns:138px minmax(0,1fr);gap:18px}.title{font-size:20px}.english{font-size:16px}.facts{gap:4px}.fact label{font-size:11px}.fact div{font-size:13px}.timegrid{gap:17px}.description{font-size:17px}.tab{padding:15px 16px}}@media(max-width:370px){.hero{grid-template-columns:112px 1fr;gap:12px}.poster{width:112px;height:166px}.title{font-size:18px}.timegrid{gap:10px}}
</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='anime-schedule.html'" aria-label="Kembali">‹</button><div class="name" id="topName">Detail anime</div><button class="bookmark detail-fav" id="fav" aria-label="Favorit">♧</button><button class="more" onclick="document.getElementById('resources').scrollIntoView({behavior:'smooth'})">⋮</button></header><nav class="tabs"><button class="tab active" data-tab="info">Info</button><button class="tab" data-tab="videos">Videos</button><button class="tab" data-tab="streams">Streams</button><button class="tab" data-tab="schedules">Schedules</button><button class="tab" data-tab="visuals">Visuals</button><button class="tab" data-tab="headlines">Headlines</button></nav><div id="state" class="state">Memuat detail anime…</div><article id="detail" class="content hide"><section class="hero"><img class="poster" id="poster" alt="Poster anime"><div><div class="date" id="date"></div><h1 class="title" id="title"></h1><div class="english" id="english"></div><div class="score">★ <strong id="score">—</strong>/10</div><div class="subscore" id="ratings"></div></div></section><section class="facts"><div class="fact"><label>Format</label><div id="format">—</div></div><div class="fact"><label>Source</label><div id="source">—</div></div><div class="fact"><label>Episodes</label><div id="episodes">—</div></div><div class="fact"><label>Run time</label><div id="runtime">—</div></div></section><section class="countbox"><div class="countlabel" id="airlabel">Jadwal episode</div><div class="timegrid" id="timegrid"><div><strong>—</strong><span>days</span></div><div><strong>—</strong><span>hours</span></div><div><strong>—</strong><span>minutes</span></div><div><strong>—</strong><span>seconds</span></div></div></section><p class="description" id="description"></p><section class="section"><h3>Studios</h3><div class="chips" id="studios"></div></section><section class="section"><h3>Tags</h3><div class="chips" id="tags"></div></section><div class="links" id="officialLinks"></div><section class="section" id="relatedSection"><h3 id="relatedTitle">More like this</h3><div class="related" id="related"></div></section><section class="section" id="resources"><h3>External resources</h3><div class="external" id="external"></div></section></article></main><script>
const API='https://graphql.anilist.co',q=new URLSearchParams(location.search),id=Number(q.get('id')), $=x=>document.getElementById(x),favKey='kenzz_anime_favorites_v1';let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem(favKey)||'[]'))}catch(e){}let anime=null,timer=null;
const query=`query($id:Int){Media(id:$id,type:ANIME){id title{romaji english native} coverImage{extraLarge large} bannerImage description(asHtml:false) averageScore meanScore popularity format source episodes duration status season seasonYear startDate{year month day} endDate{year month day} nextAiringEpisode{airingAt timeUntilAiring episode} genres tags{name rank isMediaSpoiler} studios(isMain:true){nodes{name siteUrl}} externalLinks{site url type} relations{edges{relationType node{id type format status title{romaji english} coverImage{large} season seasonYear startDate{year month day}}}} staff(perPage:5){edges{role node{name{full}}}} trailer{site id} rankings{rank year season type allTime context} countryOfOrigin}`;
async function gql(){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id}})});if(!r.ok)throw Error('API '+r.status);let j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data.Media}
function txt(el,v){$(el).textContent=v||'—'}function makeLink(text,url,cls){let a=document.createElement('a');a.textContent=text;a.href=url;a.target='_blank';a.rel='noopener noreferrer';if(cls)a.className=cls;return a}function formatDate(d){if(!d||!d.year)return 'Tanggal belum diumumkan';return [d.day,d.month,d.year].filter(Boolean).map((v,i)=>i<2?String(v).padStart(2,'0'):v).join('-')}
function draw(){document.title=(anime.title.english||anime.title.romaji)+' • Kenzz Store';txt('topName',anime.title.romaji||anime.title.english);txt('title',anime.title.romaji||anime.title.english);txt('english',anime.title.english&&anime.title.english!==anime.title.romaji?anime.title.english:'');$('poster').src=anime.coverImage.extraLarge||anime.coverImage.large;txt('date',`${formatDate(anime.startDate)}${anime.season?' ('+anime.season[0]+anime.season.slice(1).toLowerCase()+' '+(anime.seasonYear||'')+')':''}`);txt('score',anime.averageScore?(anime.averageScore/10).toFixed(2):'—');txt('ratings',`${(anime.popularity||0).toLocaleString('id-ID')} popularity · AniList`);txt('format',anime.format||'—');txt('source',anime.source?.replaceAll('_',' ')||'—');txt('episodes',`◉ 0/${anime.episodes||'—'}`);txt('runtime',anime.duration?anime.duration+'m':'—');$('description').textContent=(anime.description||'Sinopsis belum tersedia.').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
let next=anime.nextAiringEpisode;if(next){txt('airlabel',`EP${next.episode} · ${anime.format||'TV'} · ${anime.status==='RELEASING'?'JP':'Akan tayang'}`);updateTime()}else{txt('airlabel',anime.status==='NOT_YET_RELEASED'?'Tanggal tayang belum tersedia':'Jadwal episode belum tersedia');$('timegrid').innerHTML='<div><strong>—</strong><span>days</span></div><div><strong>—</strong><span>hours</span></div><div><strong>—</strong><span>minutes</span></div><div><strong>—</strong><span>seconds</span></div>'}
$('studios').replaceChildren();(anime.studios.nodes||[]).forEach(x=>$('studios').append(makeChip(x.name)));$('tags').replaceChildren();(anime.tags||[]).filter(x=>!x.isMediaSpoiler).slice(0,6).forEach(x=>$('tags').append(makeChip(x.name)));if((anime.tags||[]).length>6)$('tags').append(makeChip('Show All'));
$('officialLinks').replaceChildren();let official=(anime.externalLinks||[]).filter(x=>x.type==='INFO'||x.type==='SOCIAL'||x.type==='TWITTER').slice(0,2);if(official.length)official.forEach(x=>$('officialLinks').append(makeLink(x.site||'Website',x.url)));else{$('officialLinks').append(makeLink('AniList','https://anilist.co/anime/'+anime.id));$('officialLinks').append(makeLink('MyAnimeList','https://myanimelist.net/anime/'+anime.id))}
$('related').replaceChildren();let rel=(anime.relations?.edges||[]).filter(e=>e.node?.type==='ANIME'&&e.node.format!=='MUSIC'&&['PREQUEL','SEQUEL','SIDE_STORY','PARENT','SUMMARY'].includes(e.relationType));if(rel.length){txt('relatedTitle','More '+(anime.title.romaji||anime.title.english));rel.forEach(e=>{let a=document.createElement('a');a.href='anime-detail.html?id='+e.node.id;let im=document.createElement('img');im.loading='lazy';im.src=e.node.coverImage?.large||'';im.alt=e.node.title.romaji||'Poster';let d=document.createElement('div');d.textContent=e.node.title.english||e.node.title.romaji;let sm=document.createElement('small');sm.textContent=(e.relationType.replaceAll('_',' '))+' · '+(e.node.seasonYear||e.node.startDate?.year||'');d.append(document.createElement('br'),sm);a.append(im,d);$('related').append(a)})}else{$('relatedSection').classList.add('hide')}
$('external').replaceChildren();let ext=(anime.externalLinks||[]).slice(0,8);let found=new Set();for(let x of ext){if(!x.url||found.has(x.url))continue;found.add(x.url);$('external').append(makeLink(x.site||x.type||'Website',x.url))}if(!found.size){$('external').append(makeLink('AniList','https://anilist.co/anime/'+anime.id));$('external').append(makeLink('MyAnimeList','https://myanimelist.net/anime/'+anime.id))}
$('fav').classList.toggle('on',favs.has(anime.id));$('fav').textContent=favs.has(anime.id)?'▣':'♧';$('state').classList.add('hide');$('detail').classList.remove('hide')}
function makeChip(v){let b=document.createElement('span');b.className='chip';b.textContent=v;return b}function updateTime(){if(!anime?.nextAiringEpisode)return;let n=Math.max(0,anime.nextAiringEpisode.airingAt-Math.floor(Date.now()/1000));let vals=[Math.floor(n/86400),Math.floor(n%86400/3600),Math.floor(n%3600/60),n%60],units=['days','hours','minutes','seconds'];$('timegrid').replaceChildren(...vals.map((v,i)=>{let d=document.createElement('div'),s=document.createElement('strong'),u=document.createElement('span');s.textContent=String(v).padStart(i?2:1,'0');u.textContent=units[i];d.append(s,u);return d}))}
$('fav').addEventListener('click',()=>{if(!anime)return;if(favs.has(anime.id))favs.delete(anime.id);else favs.add(anime.id);try{localStorage.setItem(favKey,JSON.stringify([...favs]))}catch(e){}$('fav').classList.toggle('on',favs.has(anime.id));$('fav').textContent=favs.has(anime.id)?'▣':'♧'});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));let t=b.dataset.tab;if(t==='info')$('detail').scrollIntoView({behavior:'smooth'});else if(t==='schedules'){$('airlabel').scrollIntoView({behavior:'smooth',block:'center'})}else if(t==='streams'||t==='videos'){let url=anime?.trailer?.site==='youtube'?'https://www.youtube.com/watch?v='+anime.trailer.id:'https://www.youtube.com/results?search_query='+encodeURIComponent((anime?.title?.english||anime?.title?.romaji||'anime')+' '+t);window.open(url,'_blank','noopener')}else if(t==='visuals')window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent((anime?.title?.english||anime?.title?.romaji||'anime')+' anime visuals'),'_blank','noopener');else if(t==='headlines')window.open('https://www.google.com/search?tbm=nws&q='+encodeURIComponent(anime?.title?.english||anime?.title?.romaji||'anime'),'_blank','noopener')}));
if(!id){$('state').textContent='ID anime tidak ditemukan. Kembali ke katalog dan pilih anime.'}else gql().then(a=>{if(!a)throw Error('Anime tidak ditemukan');anime=a;draw();timer=setInterval(updateTime,1000)}).catch(e=>{$('state').textContent='Detail anime gagal dimuat. Periksa koneksi internet lalu coba lagi. ('+e.message+')';let b=document.createElement('button');b.className='chip';b.textContent='Coba lagi';b.onclick=()=>location.reload();$('state').append(document.createElement('br'),b)});
</script></body></html>
